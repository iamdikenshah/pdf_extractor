<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PDF Toolkit</title>
<meta name="description" content="Edit, convert and organise PDFs. Runs entirely in your browser." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128196;</text></svg>" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.css" />
<style>
  html, body { margin: 0; height: 100%; background: #F6F7FB; }

  #boot {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1rem; background: #F6F7FB; color: #1B1F35;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    transition: opacity .45s ease;
  }
  #boot.done { opacity: 0; pointer-events: none; }

  .badge {
    width: 60px; height: 60px; border-radius: 18px;
    background: linear-gradient(135deg, #4F46E5 0%, #7C6BF5 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 30px rgba(79,70,229,.32);
  }

  .title { font-size: 1.3rem; font-weight: 700; letter-spacing: -.02em; }

  .bar {
    width: 230px; height: 6px; border-radius: 999px;
    background: #E5E7F0; overflow: hidden;
  }
  .bar > i {
    display: block; height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg, #4F46E5, #7C6BF5);
    transition: width .6s cubic-bezier(.4,0,.2,1);
  }

  .stage { font-size: .88rem; color: #4B5170; min-height: 1.2em; font-weight: 550; }
  .note {
    color: #8A90AC; font-size: .78rem; text-align: center;
    max-width: 24rem; padding: 0 1.5rem; line-height: 1.5;
  }
  .note.hidden { visibility: hidden; }

  @media (prefers-reduced-motion: reduce) {
    .bar > i { transition: none; }
    #boot { transition: none; }
  }
</style>
</head>
<body>
<div id="boot" role="status" aria-live="polite">
  <div class="badge">
    <svg width="29" height="29" viewBox="0 0 24 24" fill="none" stroke="white"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="15"/>
    </svg>
  </div>
  <div class="title">PDF Toolkit</div>
  <div class="bar"><i id="boot-bar"></i></div>
  <div class="stage" id="boot-stage">Starting</div>
  <div class="note" id="boot-note">Setting up the PDF engine. This happens on your first
    visit only, then it is cached and opens straight away.</div>
</div>

<div id="root"></div>

<script type="module">
import * as stlite from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.js";

const boot  = document.getElementById("boot");
const bar   = document.getElementById("boot-bar");
const stage = document.getElementById("boot-stage");
const note  = document.getElementById("boot-note");

// A repeat visitor has the engine cached, so do not promise them a long wait.
let returning = false;
try { returning = localStorage.getItem("pdf-toolkit-loaded") === "1"; } catch (e) {}
if (returning) note.classList.add("hidden");

// stlite reports its progress as plain text. Map what it says onto the bar, so
// the movement reflects real work rather than a timer.
const STAGES = [
  ["Loading Pyodide",  18, "Starting the engine"],
  ["Mounting files",   34, "Loading the app"],
  ["Unpacking",        48, "Unpacking"],
  ["Mocking",          58, "Preparing"],
  ["Installing",       72, "Fetching the PDF engine"],
];

let pct = 6;
const setBar = (value, label) => {
  pct = Math.max(pct, value);           // never go backwards
  bar.style.width = pct + "%";
  if (label) stage.textContent = label;
};
setBar(6, returning ? "Starting" : "Downloading");

const ready = () => document.querySelector('#root [data-testid="stSidebar"]');

// Poll on a timer rather than observing mutations. stlite churns the DOM hard
// while it boots, and reacting to every mutation (especially by reading
// innerText, which forces a layout) is enough to freeze the page. textContent
// costs nothing and 400ms is plenty for a progress label.
const poll = setInterval(() => {
  if (ready()) {
    clearInterval(poll);
    setBar(100, "Ready");
    boot.classList.add("done");
    try { localStorage.setItem("pdf-toolkit-loaded", "1"); } catch (e) {}
    setTimeout(() => boot.remove(), 500);
    return;
  }
  const said = document.getElementById("root")?.textContent || "";
  for (const [needle, value, label] of STAGES) {
    if (said.includes(needle)) setBar(value, label);
  }
  if (pct >= 72 && pct < 93) setBar(pct + 1);   // gentle creep on the long stage
}, 400);

// If it never arrives, say so rather than spinning forever.
setTimeout(() => {
  if (!ready()) {
    stage.textContent = "Still working";
    note.classList.remove("hidden");
    note.textContent = "This is taking longer than usual. A slow connection can do it. " +
                       "Reloading the page is safe and picks up whatever has cached.";
  }
}, 60000);

stlite.mount({
  "entrypoint": "app.py",
  "requirements": [
    "pymupdf",
    "pillow",
    "streamlit-image-coordinates"
  ],
  "files": {
    "app.py": "\"\"\"PDF Toolkit -- Streamlit entrypoint.\n\nThin composition root: it wires the presentation layer (pdftoolkit.ui) to the\ntool pages and runs the selected one. All logic lives in pdftoolkit.core, all\nchrome in pdftoolkit.ui.\n\"\"\"\n\nimport streamlit as st\n\nfrom pdftoolkit.ui import theme\nfrom pdftoolkit.ui.pages import PAGES\n\ntheme.setup()\nst.session_state.setdefault(\"tool\", \"PDF to JPG\")\n# A session from before a tool was removed could still point at it; fall back.\nif st.session_state.tool not in PAGES:\n    st.session_state.tool = \"PDF to JPG\"\n\ntool = theme.sidebar_nav(st.session_state.tool)\ntheme.page_head(tool)\nPAGES[tool]()\n",
    "pdftoolkit/__init__.py": "\"\"\"PDF Toolkit -- a local, browser-capable PDF and image workbench.\"\"\"\n",
    "pdftoolkit/assets/styles.css": "/* PDF Toolkit -- light theme polish */\n\n:root {\n    --ink: #1B1F35;\n    --muted: #6B7192;\n    --line: #E5E7F0;\n    --primary: #4F46E5;\n    --primary-2: #7C6BF5;\n    --primary-soft: #EEF0FE;\n    --card: #FFFFFF;\n    --shadow: 0 1px 2px rgba(27, 31, 53, .04), 0 8px 24px rgba(27, 31, 53, .06);\n}\n\n/* --- shell --------------------------------------------------------------- */\n\n.stApp { background: linear-gradient(180deg, #F7F8FC 0%, #F2F3FA 100%); }\n\n[data-testid=\"stHeader\"] { background: transparent; }\n\n/* Hide the deploy button and the hamburger menu, but never the toolbar itself:\n   the control that reopens a collapsed sidebar lives inside it. */\n[data-testid=\"stAppDeployButton\"],\n[data-testid=\"stMainMenu\"],\n[data-testid=\"stMainMenuButton\"],\n[data-testid=\"stDecoration\"],\n[data-testid=\"stStatusWidget\"] {\n    display: none !important;\n}\n\n/* Make that reopen control easy to find rather than a faint glyph. */\n[data-testid=\"stExpandSidebarButton\"] {\n    background: var(--card) !important;\n    border: 1px solid var(--line) !important;\n    border-radius: 10px !important;\n    box-shadow: 0 1px 2px rgba(27, 31, 53, .05), 0 4px 12px rgba(27, 31, 53, .06) !important;\n    color: var(--primary) !important;\n    padding: .4rem !important;\n    transition: background .15s ease, border-color .15s ease;\n}\n\n[data-testid=\"stExpandSidebarButton\"]:hover {\n    background: var(--primary-soft) !important;\n    border-color: var(--primary) !important;\n}\n\n.stMainBlockContainer {\n    padding-top: 2.4rem;\n    padding-bottom: 4rem;\n    max-width: 880px;\n}\n\n/* --- sidebar ------------------------------------------------------------- */\n\n[data-testid=\"stSidebar\"] {\n    background: var(--card);\n    border-right: 1px solid var(--line);\n}\n\n[data-testid=\"stSidebarContent\"] { padding-top: .6rem; }\n\n.brand {\n    display: flex;\n    align-items: center;\n    gap: .75rem;\n    padding: .2rem .25rem;\n    margin: 0;\n}\n\n/* spacing and the divider live on the container, so the brand box stays\n   inside the height Streamlit gives its wrapper */\n[data-testid=\"stSidebar\"] .stElementContainer:has(.brand) {\n    padding-bottom: .85rem;\n    margin-bottom: .1rem;\n    border-bottom: 1px solid var(--line);\n}\n\n.brand-badge {\n    width: 40px;\n    height: 40px;\n    flex: 0 0 40px;\n    border-radius: 12px;\n    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    box-shadow: 0 6px 16px rgba(79, 70, 229, .35);\n}\n\n.brand-name {\n    font-size: 1.05rem;\n    font-weight: 700;\n    color: var(--ink);\n    line-height: 1.15;\n    letter-spacing: -.01em;\n}\n\n.brand-tag {\n    font-size: .74rem;\n    color: var(--muted);\n    line-height: 1.2;\n    margin-top: 2px;\n}\n\n.nav-group {\n    font-size: .68rem;\n    font-weight: 700;\n    letter-spacing: .09em;\n    text-transform: uppercase;\n    color: #9AA0BD;\n    /* No padding or margin here. Streamlit sizes the markdown wrapper from the\n       bare text, so anything that makes this box taller overflows the wrapper\n       and the next nav button draws on top of it. Space the group from the\n       outside instead, on the element container. */\n    padding: 0;\n    margin: 0;\n    line-height: 1.3;\n}\n\n[data-testid=\"stSidebar\"] .stElementContainer:has(.nav-group) {\n    margin-top: 1.15rem;\n    margin-bottom: .3rem;\n}\n\n/* Streamlit collapses the wrapper around custom markup to zero height, so the\n   label takes no space and the next nav button draws over it -- visible only\n   where that button has a background, i.e. the active one. Give the wrappers\n   real height. */\n[data-testid=\"stSidebar\"] .stElementContainer:has(.nav-group),\n[data-testid=\"stSidebar\"] .stElementContainer:has(.nav-group) [data-testid=\"stMarkdown\"],\n[data-testid=\"stSidebar\"] .stElementContainer:has(.nav-group) [data-testid=\"stMarkdown\"] > div {\n    height: auto !important;\n    min-height: 1.15rem !important;\n}\n\n[data-testid=\"stSidebar\"] .stElementContainer:has(.brand),\n[data-testid=\"stSidebar\"] .stElementContainer:has(.brand) [data-testid=\"stMarkdown\"],\n[data-testid=\"stSidebar\"] .stElementContainer:has(.brand) [data-testid=\"stMarkdown\"] > div {\n    height: auto !important;\n    min-height: 2.6rem !important;\n}\n\n\n\n/* nav items: flat tertiary buttons, indigo pill when active */\n\n[data-testid=\"stSidebarUserContent\"] [data-testid=\"stVerticalBlock\"] {\n    gap: .1rem;\n}\n\n[data-testid=\"stSidebar\"] .stButton > button {\n    justify-content: flex-start !important;\n    text-align: left !important;\n    font-weight: 500;\n    font-size: .89rem;\n    padding: .48rem .7rem;\n    min-height: 0;\n    border: none;\n    border-radius: 10px;\n    box-shadow: none;\n    color: #454B6B;\n    background: transparent;\n    transition: background .15s ease, color .15s ease;\n}\n\n[data-testid=\"stSidebar\"] .stButton > button > div,\n[data-testid=\"stSidebar\"] .stButton > button p {\n    text-align: left !important;\n    width: 100%;\n    justify-content: flex-start !important;\n}\n\n[data-testid=\"stSidebar\"] .stButton > button:hover {\n    background: #F2F3FA;\n    color: var(--ink);\n}\n\n[data-testid=\"stSidebar\"] [data-testid=\"stBaseButton-primary\"] {\n    background: var(--primary-soft) !important;\n    color: var(--primary) !important;\n    font-weight: 640 !important;\n    position: relative;\n    box-shadow: none !important;\n}\n\n[data-testid=\"stSidebar\"] [data-testid=\"stBaseButton-primary\"]::before {\n    content: \"\";\n    position: absolute;\n    left: 0;\n    top: 18%;\n    bottom: 18%;\n    width: 3px;\n    border-radius: 0 3px 3px 0;\n    background: var(--primary);\n}\n\n[data-testid=\"stSidebar\"] [data-testid=\"stBaseButton-primary\"]:hover {\n    background: #E6E9FE !important;\n}\n\n.side-note {\n    margin-top: 1.6rem;\n    padding: .7rem .8rem;\n    border-radius: 10px;\n    background: #F5F9F6;\n    border: 1px solid #DDEEE2;\n    color: #3D6B4E;\n    font-size: .74rem;\n    line-height: 1.45;\n}\n\n/* --- page head ----------------------------------------------------------- */\n\n.page-head {\n    display: flex;\n    align-items: center;\n    gap: .9rem;\n    margin-bottom: .35rem;\n}\n\n.page-icon {\n    width: 46px;\n    height: 46px;\n    flex: 0 0 46px;\n    border-radius: 13px;\n    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    box-shadow: 0 6px 18px rgba(79, 70, 229, .3);\n}\n\n.page-title {\n    font-size: 1.7rem;\n    font-weight: 750;\n    color: var(--ink);\n    letter-spacing: -.025em;\n    line-height: 1.1;\n}\n\n.page-sub {\n    color: var(--muted);\n    font-size: .92rem;\n    margin: 0 0 1.4rem 0;\n}\n\n.msr {\n    font-family: 'Material Symbols Rounded', 'Material Symbols Outlined', sans-serif;\n    font-weight: 400;\n    font-style: normal;\n    font-size: 24px;\n    line-height: 1;\n    color: #fff;\n    letter-spacing: normal;\n    text-transform: none;\n    white-space: nowrap;\n    -webkit-font-feature-settings: 'liga';\n    -webkit-font-smoothing: antialiased;\n    font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;\n}\n\n/* --- cards --------------------------------------------------------------- */\n\n[data-testid=\"stVerticalBlockBorderWrapper\"]:has(> div > [data-testid=\"stVerticalBlock\"]) {\n    border-radius: 16px;\n}\n\n.stMain [data-testid=\"stVerticalBlockBorderWrapper\"][style*=\"border\"] {\n    background: var(--card);\n    border: 1px solid #E2E4F0 !important;\n    border-radius: 16px !important;\n    padding: 1.4rem 1.5rem !important;\n    box-shadow: var(--shadow);\n}\n\n/* --- uploader ------------------------------------------------------------ */\n\n[data-testid=\"stFileUploaderDropzone\"] {\n    background: #FBFBFE;\n    border: 1.5px dashed #C9CDE4;\n    border-radius: 14px;\n    padding: 1.5rem 1rem;\n    transition: border-color .15s ease, background .15s ease;\n}\n\n[data-testid=\"stFileUploaderDropzone\"]:hover {\n    border-color: var(--primary);\n    background: var(--primary-soft);\n}\n\n[data-testid=\"stFileUploaderDropzone\"] button {\n    border-radius: 9px;\n    font-weight: 600;\n}\n\n/* --- buttons ------------------------------------------------------------- */\n\n.stMain [data-testid=\"stBaseButton-primary\"] {\n    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);\n    border: none;\n    font-weight: 640;\n    letter-spacing: .005em;\n    padding: .58rem 1.1rem;\n    box-shadow: 0 4px 14px rgba(79, 70, 229, .3);\n    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;\n}\n\n.stMain [data-testid=\"stBaseButton-primary\"]:hover {\n    filter: brightness(1.06);\n    transform: translateY(-1px);\n    box-shadow: 0 7px 20px rgba(79, 70, 229, .38);\n}\n\n.stMain [data-testid=\"stBaseButton-primary\"]:active { transform: translateY(0); }\n\n/* secondary downloads are outlined; primary ones keep the gradient */\n.stMain .stDownloadButton [data-testid=\"stBaseButton-secondary\"] {\n    background: var(--card);\n    color: var(--primary);\n    border: 1.4px solid #CFD2F2;\n    font-weight: 620;\n    transition: background .15s ease, border-color .15s ease;\n}\n\n.stMain .stDownloadButton [data-testid=\"stBaseButton-secondary\"]:hover {\n    background: var(--primary-soft);\n    border-color: var(--primary);\n    color: var(--primary);\n}\n\n.stMain .stDownloadButton [data-testid=\"stBaseButton-primary\"] {\n    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);\n    color: #fff;\n    border: none;\n    font-weight: 640;\n    box-shadow: 0 4px 14px rgba(79, 70, 229, .3);\n}\n\n.stMain .stDownloadButton [data-testid=\"stBaseButton-primary\"]:hover {\n    filter: brightness(1.06);\n    transform: translateY(-1px);\n}\n\n/* --- inputs -------------------------------------------------------------- */\n\n.stTextInput input, .stTextArea textarea, .stNumberInput input {\n    border-radius: 10px;\n}\n\n.stTextInput input:focus, .stTextArea textarea:focus {\n    border-color: var(--primary);\n    box-shadow: 0 0 0 3px rgba(79, 70, 229, .13);\n}\n\n[data-testid=\"stWidgetLabel\"] p {\n    font-weight: 600;\n    font-size: .84rem;\n    color: #3A4062;\n}\n\n/* --- feedback ------------------------------------------------------------ */\n\n[data-testid=\"stAlert\"] {\n    border-radius: 12px;\n    border: 1px solid transparent;\n}\n\n[data-testid=\"stMetric\"] {\n    background: linear-gradient(135deg, #FAFAFE 0%, #F4F5FD 100%);\n    border: 1px solid var(--line);\n    border-radius: 14px;\n    padding: 1rem 1.15rem;\n}\n\n.stImage img {\n    border-radius: 12px;\n    border: 1px solid var(--line);\n    box-shadow: var(--shadow);\n}\n\n.stImage [data-testid=\"stImageCaption\"] {\n    color: var(--muted);\n    font-size: .78rem;\n    font-weight: 500;\n}\n\n/* --- info rows (PDF info tool) ------------------------------------------- */\n\n.info-row {\n    display: flex;\n    justify-content: space-between;\n    gap: 1rem;\n    padding: .62rem .1rem;\n    border-bottom: 1px solid #F0F1F7;\n    font-size: .9rem;\n}\n\n.info-row:last-child { border-bottom: none; }\n.info-key { color: var(--muted); font-weight: 500; }\n.info-val { color: var(--ink); font-weight: 620; text-align: right; word-break: break-word; }\n\n/* --- misc ---------------------------------------------------------------- */\n\n.chip-row { display: flex; flex-wrap: wrap; gap: .4rem; margin: .1rem 0 .2rem; }\n\n.chip {\n    background: var(--primary-soft);\n    color: var(--primary);\n    border: 1px solid #DDE0FB;\n    border-radius: 999px;\n    padding: .22rem .7rem;\n    font-size: .78rem;\n    font-weight: 600;\n}\n\n.chip-num {\n    background: var(--primary);\n    color: #fff;\n    border-radius: 999px;\n    width: 17px;\n    height: 17px;\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    font-size: .66rem;\n    margin-right: .4rem;\n}\n\nhr { border-color: var(--line); }\n\nfooter, #MainMenu { visibility: hidden; }\n\n\n/* --- phones and small tablets -------------------------------------------- */\n\n@media (max-width: 640px) {\n    .stMainBlockContainer {\n        padding-top: 1.1rem;\n        padding-bottom: 2.5rem;\n        padding-left: .85rem;\n        padding-right: .85rem;\n    }\n\n    .page-head { gap: .65rem; }\n\n    .page-icon {\n        width: 38px;\n        height: 38px;\n        flex: 0 0 38px;\n        border-radius: 11px;\n    }\n\n    .page-icon .msr { font-size: 20px; }\n    .page-title { font-size: 1.25rem; }\n\n    .page-sub {\n        font-size: .86rem;\n        margin-bottom: 1rem;\n    }\n\n    .stMain [data-testid=\"stVerticalBlockBorderWrapper\"][style*=\"border\"] {\n        padding: 1rem .9rem !important;\n        border-radius: 14px !important;\n    }\n\n    /* the sidebar is an overlay on mobile: leave a strip of the page visible */\n    [data-testid=\"stSidebar\"] {\n        width: 84vw !important;\n        min-width: 0 !important;\n    }\n\n    /* comfortable tap targets */\n    .stMain .stButton button,\n    .stMain .stDownloadButton button {\n        min-height: 44px;\n    }\n\n}\n\n/* --- the editor needs a wide page, so it stacks earlier than everything else -- */\n\n@media (max-width: 1000px) {\n    /* show the page above the tools, at the full width of the screen */\n    .stMain [data-testid=\"stHorizontalBlock\"]:has(iframe) {\n        flex-direction: column;\n    }\n\n    /* Streamlit sizes columns with an inline width, so stacking alone leaves them\n       narrow: make both full width as well. */\n    .stMain [data-testid=\"stHorizontalBlock\"]:has(iframe) > [data-testid=\"stColumn\"] {\n        width: 100% !important;\n        min-width: 100% !important;\n        flex: 1 1 100% !important;\n    }\n\n    .stMain [data-testid=\"stHorizontalBlock\"]:has(iframe) > [data-testid=\"stColumn\"]:last-child {\n        order: -1;\n        margin-bottom: .9rem;\n    }\n}\n",
    "pdftoolkit/core/__init__.py": "\"\"\"Pure PDF and image operations. No UI code.\"\"\"\n",
    "pdftoolkit/core/image_ops.py": "\"\"\"Image operations. Pure functions on bytes, using Pillow. No UI code.\n\nEverything here uses only Pillow, which ships in both the local install and the\nbrowser (Pyodide) build, so every image tool works in both. HEIC is deliberately\nabsent: decoding it needs libheif, which has no WebAssembly build, so it could\nnot run on the hosted site.\n\"\"\"\n\nimport io\n\nfrom PIL import Image, ImageOps\n\n# What we accept in, and what we can write out.\nINPUT_TYPES = [\"png\", \"jpg\", \"jpeg\", \"webp\", \"bmp\", \"gif\", \"tiff\"]\nOUTPUT_FORMATS = {\n    \"JPG\": (\"JPEG\", \"jpg\"),\n    \"PNG\": (\"PNG\", \"png\"),\n    \"WEBP\": (\"WEBP\", \"webp\"),\n    \"BMP\": (\"BMP\", \"bmp\"),\n    \"TIFF\": (\"TIFF\", \"tiff\"),\n    \"GIF\": (\"GIF\", \"gif\"),\n}\n# Formats that cannot store transparency, so they need a background colour.\nOPAQUE_FORMATS = {\"JPEG\", \"BMP\"}\nDEFAULT_QUALITY = 85\n\n\ndef _hex_to_rgb(value):\n    \"\"\"'#4F46E5' -> (79, 70, 229).\"\"\"\n    value = value.lstrip(\"#\")\n    return tuple(int(value[i:i + 2], 16) for i in (0, 2, 4))\n\n\ndef _load(image_bytes):\n    im = Image.open(io.BytesIO(image_bytes))\n    im.load()\n    src_format = im.format\n    # honour EXIF orientation so phone photos are not sideways\n    im = ImageOps.exif_transpose(im)\n    im.format = src_format  # exif_transpose returns a copy that drops this\n    return im\n\n\ndef _flatten(im, background=\"#FFFFFF\"):\n    \"\"\"Composite an image with transparency onto a solid colour.\"\"\"\n    if im.mode in (\"RGBA\", \"LA\") or (im.mode == \"P\" and \"transparency\" in im.info):\n        base = Image.new(\"RGBA\", im.size, _hex_to_rgb(background) + (255,))\n        base.alpha_composite(im.convert(\"RGBA\"))\n        return base.convert(\"RGB\")\n    return im.convert(\"RGB\")\n\n\ndef _save(im, pil_format, quality, background=\"#FFFFFF\"):\n    if pil_format in OPAQUE_FORMATS:\n        im = _flatten(im, background)\n    elif pil_format in (\"PNG\", \"WEBP\") and im.mode not in (\"RGBA\", \"RGB\", \"P\", \"L\"):\n        im = im.convert(\"RGBA\")\n\n    buf = io.BytesIO()\n    params = {}\n    if pil_format in (\"JPEG\", \"WEBP\"):\n        params[\"quality\"] = quality\n    if pil_format == \"JPEG\":\n        params[\"optimize\"] = True\n    im.save(buf, pil_format, **params)\n    return buf.getvalue()\n\n\ndef _resolve_format(out_format):\n    try:\n        return OUTPUT_FORMATS[out_format]\n    except KeyError:\n        raise ValueError(f\"Unsupported output format: {out_format}\") from None\n\n\ndef convert(image_bytes, out_format=\"PNG\", quality=DEFAULT_QUALITY, background=\"#FFFFFF\"):\n    \"\"\"Change an image's format. Returns (jpg/png/... bytes, extension).\"\"\"\n    pil_format, ext = _resolve_format(out_format)\n    return _save(_load(image_bytes), pil_format, quality, background), ext\n\n\ndef resize(image_bytes, width=None, height=None, percent=None, keep_aspect=True,\n           out_format=None, quality=DEFAULT_QUALITY, background=\"#FFFFFF\"):\n    \"\"\"Resize by target dimensions or by a percentage of the original.\"\"\"\n    im = _load(image_bytes)\n    w0, h0 = im.size\n\n    if percent:\n        w, h = max(1, round(w0 * percent / 100)), max(1, round(h0 * percent / 100))\n    elif width and height and not keep_aspect:\n        w, h = width, height\n    elif width or height:\n        if width and height:\n            scale = min(width / w0, height / h0)      # fit inside the box\n        else:\n            scale = (width / w0) if width else (height / h0)\n        w, h = max(1, round(w0 * scale)), max(1, round(h0 * scale))\n    else:\n        raise ValueError(\"Give a width, a height, or a percentage.\")\n\n    resized = im.resize((w, h), Image.LANCZOS)\n    if out_format:\n        pil_format, ext = _resolve_format(out_format)\n    else:\n        pil_format = im.format or \"PNG\"\n        ext = OUTPUT_FORMATS.get(pil_format if pil_format != \"JPEG\" else \"JPG\",\n                                 (pil_format, pil_format.lower()))[1]\n    return _save(resized, pil_format, quality, background), ext, (w, h)\n\n\ndef compress(image_bytes, quality=70, out_format=None, background=\"#FFFFFF\"):\n    \"\"\"Re-encode at a lower quality to shrink the file.\"\"\"\n    im = _load(image_bytes)\n    if out_format:\n        pil_format, ext = _resolve_format(out_format)\n    else:\n        # keep the type if it is lossy-capable, otherwise default to JPG\n        src = (im.format or \"\").upper()\n        pil_format, ext = (\"WEBP\", \"webp\") if src == \"WEBP\" else (\"JPEG\", \"jpg\")\n    return _save(im, pil_format, quality, background), ext\n\n\ndef transform(image_bytes, rotate=0, flip=None, out_format=None,\n              quality=DEFAULT_QUALITY, background=\"#FFFFFF\"):\n    \"\"\"Rotate by 0/90/180/270 degrees and optionally mirror the image.\"\"\"\n    im = _load(image_bytes)\n    if rotate:\n        if rotate % 90:\n            raise ValueError(\"Rotation must be a multiple of 90 degrees.\")\n        im = im.rotate(-rotate, expand=True)   # negative = clockwise\n    if flip == \"horizontal\":\n        im = ImageOps.mirror(im)\n    elif flip == \"vertical\":\n        im = ImageOps.flip(im)\n\n    if out_format:\n        pil_format, ext = _resolve_format(out_format)\n    else:\n        pil_format = im.format or \"PNG\"\n        ext = OUTPUT_FORMATS.get(\"JPG\" if pil_format == \"JPEG\" else pil_format,\n                                 (pil_format, pil_format.lower()))[1]\n    return _save(im, pil_format, quality, background), ext\n\n\ndef set_background(image_bytes, color=\"#FFFFFF\", out_format=\"PNG\",\n                   quality=DEFAULT_QUALITY):\n    \"\"\"Replace transparency with a solid colour.\n\n    Useful for logos, signatures and product shots saved on a transparent\n    background. It does not detect or remove a photographic background -- that\n    needs an ML model this app deliberately does not carry.\n    \"\"\"\n    im = _load(image_bytes)\n    if im.mode not in (\"RGBA\", \"LA\") and not (im.mode == \"P\" and \"transparency\" in im.info):\n        raise ValueError(\n            \"This image has no transparent areas to fill. Background colour only \"\n            \"applies to images with transparency, such as a PNG logo.\"\n        )\n    flat = _flatten(im, color)\n    pil_format, ext = _resolve_format(out_format)\n    return _save(flat, pil_format, quality, color), ext\n\n\ndef info(image_bytes):\n    \"\"\"Basic facts for display.\"\"\"\n    im = _load(image_bytes)\n    return {\n        \"Format\": im.format or \"-\",\n        \"Size\": f\"{im.size[0]} x {im.size[1]} px\",\n        \"Mode\": im.mode,\n        \"Transparency\": \"Yes\" if im.mode in (\"RGBA\", \"LA\")\n        or (im.mode == \"P\" and \"transparency\" in im.info) else \"No\",\n    }\n",
    "pdftoolkit/core/pdf_ops.py": "\"\"\"PDF operations. Pure functions on bytes -- no UI code here.\"\"\"\n\nimport fitz  # PyMuPDF\n\nDPI = 200\nQUALITY = 90\n\n\ndef _open(pdf_bytes, password=None):\n    \"\"\"Open a PDF, unlocking it first if it is password protected.\"\"\"\n    doc = fitz.open(stream=pdf_bytes, filetype=\"pdf\")\n    if doc.needs_pass and not doc.authenticate(password or \"\"):\n        doc.close()\n        raise ValueError(\"This PDF is password protected. Enter the correct password.\")\n    return doc\n\n\ndef page_count(pdf_bytes, password=None):\n    with _open(pdf_bytes, password) as doc:\n        return doc.page_count\n\n\ndef parse_pages(spec, total):\n    \"\"\"Turn a page spec like '1-3,5' into zero-based indices. Empty means all pages.\"\"\"\n    spec = (spec or \"\").strip()\n    if not spec:\n        return list(range(total))\n\n    pages = []\n    for part in spec.split(\",\"):\n        part = part.strip()\n        if not part:\n            continue\n        try:\n            if \"-\" in part:\n                start_text, _, end_text = part.partition(\"-\")\n                start, end = int(start_text), int(end_text)\n            else:\n                start = end = int(part)\n        except ValueError:\n            raise ValueError(f\"'{part}' is not a page number or range.\") from None\n        if start < 1 or end > total or start > end:\n            raise ValueError(f\"'{part}' is out of range for a {total}-page PDF.\")\n        pages.extend(range(start - 1, end))\n\n    if not pages:\n        raise ValueError(\"No pages selected.\")\n    return sorted(set(pages))\n\n\ndef pdf_to_jpgs(pdf_bytes, dpi=DPI, quality=QUALITY, password=None):\n    \"\"\"One JPG per page. Returns [(filename, jpg_bytes), ...].\"\"\"\n    with _open(pdf_bytes, password) as doc:\n        return [\n            (f\"page_{i:03d}.jpg\", page.get_pixmap(dpi=dpi).tobytes(\"jpg\", jpg_quality=quality))\n            for i, page in enumerate(doc, start=1)\n        ]\n\n\ndef images_to_pdf(images):\n    \"\"\"Build a PDF from [(filename, image_bytes), ...], one image per page.\"\"\"\n    if not images:\n        raise ValueError(\"No images given.\")\n\n    out = fitz.open()\n    for name, data in images:\n        ext = name.rsplit(\".\", 1)[-1].lower()\n        with fitz.open(stream=data, filetype=ext) as img:\n            rect = img[0].rect\n            pdf_bytes = img.convert_to_pdf()\n        with fitz.open(\"pdf\", pdf_bytes) as page_pdf:\n            out.new_page(width=rect.width, height=rect.height).show_pdf_page(rect, page_pdf, 0)\n\n    data = out.tobytes(garbage=4, deflate=True)\n    out.close()\n    return data\n\n\ndef merge_pdfs(pdfs):\n    \"\"\"Join [(filename, pdf_bytes), ...] into one PDF, in the order given.\"\"\"\n    if not pdfs:\n        raise ValueError(\"No PDFs given.\")\n\n    out = fitz.open()\n    for name, data in pdfs:\n        try:\n            with _open(data) as doc:\n                out.insert_pdf(doc)\n        except ValueError:\n            out.close()\n            raise ValueError(f\"'{name}' is password protected -- unlock it first.\") from None\n\n    data = out.tobytes(garbage=4, deflate=True)\n    out.close()\n    return data\n\n\ndef split_to_pages(pdf_bytes, password=None):\n    \"\"\"One single-page PDF per page. Returns [(filename, pdf_bytes), ...].\"\"\"\n    with _open(pdf_bytes, password) as doc:\n        results = []\n        for i in range(doc.page_count):\n            single = fitz.open()\n            single.insert_pdf(doc, from_page=i, to_page=i)\n            results.append((f\"page_{i + 1:03d}.pdf\", single.tobytes(garbage=4, deflate=True)))\n            single.close()\n        return results\n\n\ndef extract_pages(pdf_bytes, spec, password=None):\n    \"\"\"A new PDF holding only the selected pages.\"\"\"\n    with _open(pdf_bytes, password) as doc:\n        pages = parse_pages(spec, doc.page_count)\n        out = fitz.open()\n        for i in pages:\n            out.insert_pdf(doc, from_page=i, to_page=i)\n        data = out.tobytes(garbage=4, deflate=True)\n        out.close()\n        return data\n\n\ndef delete_pages(pdf_bytes, spec, password=None):\n    \"\"\"A new PDF with the selected pages removed.\"\"\"\n    with _open(pdf_bytes, password) as doc:\n        drop = set(parse_pages(spec, doc.page_count))\n        keep = [i for i in range(doc.page_count) if i not in drop]\n        if not keep:\n            raise ValueError(\"That would delete every page.\")\n        doc.delete_pages(sorted(drop))\n        return doc.tobytes(garbage=4, deflate=True)\n\n\ndef rotate_pages(pdf_bytes, spec, angle, password=None):\n    \"\"\"Rotate the selected pages by 90, 180 or 270 degrees.\"\"\"\n    if angle % 90:\n        raise ValueError(\"Rotation must be a multiple of 90 degrees.\")\n    with _open(pdf_bytes, password) as doc:\n        for i in parse_pages(spec, doc.page_count):\n            page = doc[i]\n            page.set_rotation((page.rotation + angle) % 360)\n        return doc.tobytes(garbage=4, deflate=True)\n\n\ndef compress(pdf_bytes, password=None, rasterize=False, dpi=150, quality=70):\n    \"\"\"Shrink a PDF. Rasterizing compresses far more but turns text into images.\"\"\"\n    with _open(pdf_bytes, password) as doc:\n        if not rasterize:\n            return doc.tobytes(garbage=4, deflate=True, clean=True)\n\n        out = fitz.open()\n        for page in doc:\n            pix = page.get_pixmap(dpi=dpi)\n            with fitz.open(stream=pix.tobytes(\"jpg\", jpg_quality=quality), filetype=\"jpg\") as img:\n                pdf_page = img.convert_to_pdf()\n            with fitz.open(\"pdf\", pdf_page) as page_pdf:\n                out.new_page(width=page.rect.width, height=page.rect.height).show_pdf_page(\n                    page.rect, page_pdf, 0\n                )\n        data = out.tobytes(garbage=4, deflate=True)\n        out.close()\n        return data\n\n\ndef add_password(pdf_bytes, new_password, password=None):\n    \"\"\"Encrypt with AES-256.\"\"\"\n    if not new_password:\n        raise ValueError(\"Enter a password to set.\")\n    with _open(pdf_bytes, password) as doc:\n        return doc.tobytes(\n            encryption=fitz.PDF_ENCRYPT_AES_256,\n            owner_pw=new_password,\n            user_pw=new_password,\n            garbage=4,\n            deflate=True,\n        )\n\n\ndef remove_password(pdf_bytes, password):\n    \"\"\"Strip encryption, given the current password.\"\"\"\n    with _open(pdf_bytes, password) as doc:\n        return doc.tobytes(encryption=fitz.PDF_ENCRYPT_NONE, garbage=4, deflate=True)\n\n\ndef remove_restrictions(pdf_bytes):\n    \"\"\"Remove owner-password restrictions from a PDF that already opens freely.\n\n    Some PDFs open without a password but limit printing, copying or editing with\n    an \"owner\" (permissions) password. Because the content is already readable,\n    those limits can be removed without knowing that password.\n\n    This cannot open a PDF that needs a password just to be viewed: that content\n    is encrypted, and no tool can read it without the password. Such a file is\n    reported so the user is not misled.\n    \"\"\"\n    doc = fitz.open(stream=pdf_bytes, filetype=\"pdf\")\n    if doc.needs_pass:\n        doc.close()\n        raise ValueError(\n            \"This PDF needs a password just to open, so its contents are encrypted \"\n            \"and cannot be read without it. If you know the password, use \"\n            \"'Remove a password' instead.\"\n        )\n    data = doc.tobytes(encryption=fitz.PDF_ENCRYPT_NONE, garbage=4, deflate=True)\n    doc.close()\n    return data\n\n\ndef extract_text(pdf_bytes, password=None):\n    \"\"\"Plain text of the whole document, with a header per page.\"\"\"\n    with _open(pdf_bytes, password) as doc:\n        return \"\\n\\n\".join(\n            f\"--- Page {i} ---\\n{page.get_text().strip()}\" for i, page in enumerate(doc, start=1)\n        )\n\n\ndef pdf_info(pdf_bytes, password=None):\n    \"\"\"Basic metadata for display.\"\"\"\n    with _open(pdf_bytes, password) as doc:\n        meta = doc.metadata or {}\n        first = doc[0].rect if doc.page_count else None\n        return {\n            \"Pages\": doc.page_count,\n            \"Title\": meta.get(\"title\") or \"-\",\n            \"Author\": meta.get(\"author\") or \"-\",\n            \"Producer\": meta.get(\"producer\") or \"-\",\n            \"Created\": meta.get(\"creationDate\") or \"-\",\n            \"Encrypted\": \"Yes\" if doc.needs_pass else \"No\",\n            \"First page size\": f\"{first.width:.0f} x {first.height:.0f} pt\" if first else \"-\",\n        }\n\n\n# --- editing ---------------------------------------------------------------\n\nPOSITIONS = [\n    \"Top left\", \"Top centre\", \"Top right\",\n    \"Middle left\", \"Centre\", \"Middle right\",\n    \"Bottom left\", \"Bottom centre\", \"Bottom right\",\n]\n\nNUMBER_FORMATS = {\"1\": \"{n}\", \"Page 1\": \"Page {n}\", \"1 / 10\": \"{n} / {total}\"}\n\n\ndef hex_to_rgb(value):\n    \"\"\"'#4F46E5' -> (0.31, 0.27, 0.90).\"\"\"\n    value = value.lstrip(\"#\")\n    return tuple(int(value[i:i + 2], 16) / 255 for i in (0, 2, 4))\n\n\ndef parse_order(spec, total):\n    \"\"\"Like parse_pages but keeps your order and allows repeats: '3,1,1' -> [2,0,0].\"\"\"\n    spec = (spec or \"\").strip()\n    if not spec:\n        return list(range(total))\n\n    order = []\n    for part in spec.split(\",\"):\n        part = part.strip()\n        if not part:\n            continue\n        try:\n            if \"-\" in part:\n                a, _, b = part.partition(\"-\")\n                start, end = int(a), int(b)\n                step = 1 if end >= start else -1\n                chunk = list(range(start, end + step, step))\n            else:\n                chunk = [int(part)]\n        except ValueError:\n            raise ValueError(f\"'{part}' is not a page number or range.\") from None\n        for n in chunk:\n            if not 1 <= n <= total:\n                raise ValueError(f\"Page {n} does not exist in a {total}-page PDF.\")\n            order.append(n - 1)\n\n    if not order:\n        raise ValueError(\"No pages selected.\")\n    return order\n\n\ndef _place(page_rect, position, width, height, margin):\n    \"\"\"Top-left corner for a `width` x `height` box placed at `position`.\"\"\"\n    row, _, col = position.lower().partition(\" \")\n    x = {\"left\": margin,\n         \"centre\": (page_rect.width - width) / 2,\n         \"right\": page_rect.width - width - margin}[col]\n    y = {\"top\": margin,\n         \"middle\": (page_rect.height - height) / 2,\n         \"bottom\": page_rect.height - height - margin}[row]\n    return x, y\n\n\ndef render_preview(pdf_bytes, index=0, dpi=90, password=None):\n    \"\"\"One page as a JPG, for on-screen previews.\"\"\"\n    with _open(pdf_bytes, password) as doc:\n        index = max(0, min(index, doc.page_count - 1))\n        return doc[index].get_pixmap(dpi=dpi).tobytes(\"jpg\", jpg_quality=85)\n\n\ndef add_text(pdf_bytes, spec, text, position=\"Bottom centre\", size=14, color=\"#1B1F35\",\n             opacity=1.0, margin=36, password=None):\n    \"\"\"Stamp a line (or several) of text onto the selected pages.\"\"\"\n    if not text.strip():\n        raise ValueError(\"Enter the text you want to add.\")\n\n    lines = text.splitlines() or [text]\n    font = fitz.Font(\"helv\")\n    rgb = hex_to_rgb(color)\n    leading = size * 1.35\n\n    with _open(pdf_bytes, password) as doc:\n        for i in parse_pages(spec, doc.page_count):\n            page = doc[i]\n            block_w = max(font.text_length(line, size) for line in lines)\n            block_h = leading * len(lines)\n            x, y = _place(page.rect, position, block_w, block_h, margin)\n            writer = fitz.TextWriter(page.rect)\n            for row, line in enumerate(lines):\n                if line.strip():\n                    writer.append(fitz.Point(x, y + size + row * leading), line,\n                                  font=font, fontsize=size)\n            writer.write_text(page, color=rgb, opacity=opacity)\n        return doc.tobytes(garbage=4, deflate=True)\n\n\ndef add_image(pdf_bytes, spec, image_bytes, position=\"Bottom right\", width_pct=25,\n              opacity=1.0, margin=36, password=None):\n    \"\"\"Place an image (logo, signature, stamp) on the selected pages.\"\"\"\n    pix = fitz.Pixmap(image_bytes)\n    if opacity < 1:\n        if not pix.alpha:\n            pix = fitz.Pixmap(pix, 1)\n        pix.set_alpha(bytes([int(255 * opacity)]) * (pix.width * pix.height))\n    image_bytes = pix.tobytes(\"png\")\n    ratio = pix.height / pix.width\n\n    with _open(pdf_bytes, password) as doc:\n        for i in parse_pages(spec, doc.page_count):\n            page = doc[i]\n            width = page.rect.width * width_pct / 100\n            height = width * ratio\n            x, y = _place(page.rect, position, width, height, margin)\n            page.insert_image(fitz.Rect(x, y, x + width, y + height),\n                              stream=image_bytes, overlay=True)\n        return doc.tobytes(garbage=4, deflate=True)\n\n\ndef add_watermark(pdf_bytes, text, spec=\"\", size=60, color=\"#9AA0BD\", opacity=0.25,\n                  angle=45, password=None):\n    \"\"\"Diagonal watermark across the selected pages.\"\"\"\n    if not text.strip():\n        raise ValueError(\"Enter the watermark text.\")\n\n    font = fitz.Font(\"helv\")\n    rgb = hex_to_rgb(color)\n\n    with _open(pdf_bytes, password) as doc:\n        for i in parse_pages(spec, doc.page_count):\n            page = doc[i]\n            width = font.text_length(text, size)\n            centre = fitz.Point(page.rect.width / 2, page.rect.height / 2)\n            writer = fitz.TextWriter(page.rect)\n            writer.append(fitz.Point(centre.x - width / 2, centre.y + size / 3), text,\n                          font=font, fontsize=size)\n            writer.write_text(page, color=rgb, opacity=opacity,\n                              morph=(centre, fitz.Matrix(angle)))\n        return doc.tobytes(garbage=4, deflate=True)\n\n\ndef add_page_numbers(pdf_bytes, position=\"Bottom centre\", start=1, template=\"{n}\",\n                     size=10, color=\"#6B7192\", margin=28, skip_first=False, password=None):\n    \"\"\"Number the pages.\"\"\"\n    font = fitz.Font(\"helv\")\n    rgb = hex_to_rgb(color)\n\n    with _open(pdf_bytes, password) as doc:\n        total = doc.page_count\n        for i, page in enumerate(doc):\n            if skip_first and i == 0:\n                continue\n            label = template.format(n=i + start, total=total + start - 1)\n            width = font.text_length(label, size)\n            x, y = _place(page.rect, position, width, size, margin)\n            writer = fitz.TextWriter(page.rect)\n            writer.append(fitz.Point(x, y + size), label, font=font, fontsize=size)\n            writer.write_text(page, color=rgb)\n        return doc.tobytes(garbage=4, deflate=True)\n\n\ndef find_text(pdf_bytes, query, password=None):\n    \"\"\"Where a phrase appears: [(page number, hits), ...].\"\"\"\n    if not query.strip():\n        raise ValueError(\"Enter the text to search for.\")\n    with _open(pdf_bytes, password) as doc:\n        return [(i + 1, len(page.search_for(query))) for i, page in enumerate(doc)\n                if page.search_for(query)]\n\n\ndef highlight_text(pdf_bytes, query, color=\"#FFE066\", password=None):\n    \"\"\"Highlight every occurrence. Returns (pdf_bytes, hit count).\"\"\"\n    if not query.strip():\n        raise ValueError(\"Enter the text to highlight.\")\n    rgb = hex_to_rgb(color)\n\n    with _open(pdf_bytes, password) as doc:\n        hits = 0\n        for page in doc:\n            for rect in page.search_for(query):\n                annot = page.add_highlight_annot(rect)\n                annot.set_colors(stroke=rgb)\n                annot.update()\n                hits += 1\n        if not hits:\n            raise ValueError(f\"'{query}' was not found in this PDF.\")\n        return doc.tobytes(garbage=4, deflate=True), hits\n\n\ndef redact_text(pdf_bytes, query, fill=\"#000000\", password=None):\n    \"\"\"Permanently remove every occurrence. Returns (pdf_bytes, hit count).\"\"\"\n    if not query.strip():\n        raise ValueError(\"Enter the text to redact.\")\n    rgb = hex_to_rgb(fill)\n\n    with _open(pdf_bytes, password) as doc:\n        hits = 0\n        for page in doc:\n            for rect in page.search_for(query):\n                page.add_redact_annot(rect, fill=rgb)\n                hits += 1\n            if hits:\n                page.apply_redactions()\n        if not hits:\n            raise ValueError(f\"'{query}' was not found in this PDF.\")\n        return doc.tobytes(garbage=4, deflate=True), hits\n\n\ndef reorder_pages(pdf_bytes, spec, password=None):\n    \"\"\"Rebuild the document in the given page order.\"\"\"\n    with _open(pdf_bytes, password) as doc:\n        doc.select(parse_order(spec, doc.page_count))\n        return doc.tobytes(garbage=4, deflate=True)\n\n\n# --- page level editing ----------------------------------------------------\n#\n# Everything below works on a single page and takes coordinates in PDF points,\n# so the editor can translate a click on a rendered image straight into a change.\n\n\ndef page_size(pdf_bytes, index=0, password=None):\n    with _open(pdf_bytes, password) as doc:\n        rect = doc[index].rect\n        return rect.width, rect.height\n\n\ndef render_page_px(pdf_bytes, index=0, width_px=760, password=None):\n    \"\"\"Render a page to a PNG about `width_px` wide.\n\n    Returns (png_bytes, points_per_pixel) so a click on the image can be\n    converted back into PDF coordinates.\n    \"\"\"\n    with _open(pdf_bytes, password) as doc:\n        page = doc[max(0, min(index, doc.page_count - 1))]\n        zoom = width_px / page.rect.width\n        pix = page.get_pixmap(matrix=fitz.Matrix(zoom, zoom))\n        return pix.tobytes(\"png\"), 1 / zoom\n\n\ndef _int_to_rgb(value):\n    return ((value >> 16) & 255) / 255, ((value >> 8) & 255) / 255, (value & 255) / 255\n\n\ndef page_spans(pdf_bytes, index=0, password=None):\n    \"\"\"Every run of text on the page, with its box, size and colour.\"\"\"\n    with _open(pdf_bytes, password) as doc:\n        spans = []\n        for block in doc[index].get_text(\"dict\")[\"blocks\"]:\n            for line in block.get(\"lines\", []):\n                for span in line[\"spans\"]:\n                    if span[\"text\"].strip():\n                        spans.append({\n                            \"text\": span[\"text\"],\n                            \"bbox\": tuple(span[\"bbox\"]),\n                            \"size\": span[\"size\"],\n                            \"font\": span[\"font\"],\n                            \"color\": _int_to_rgb(span[\"color\"]),\n                            \"origin\": tuple(span[\"origin\"]),\n                        })\n        return spans\n\n\ndef span_at(pdf_bytes, index, point, password=None):\n    \"\"\"The text run under a point, if any. Picks the smallest box that contains it.\"\"\"\n    x, y = point\n    hits = [s for s in page_spans(pdf_bytes, index, password)\n            if s[\"bbox\"][0] <= x <= s[\"bbox\"][2] and s[\"bbox\"][1] <= y <= s[\"bbox\"][3]]\n    if not hits:\n        return None\n    return min(hits, key=lambda s: (s[\"bbox\"][2] - s[\"bbox\"][0]) * (s[\"bbox\"][3] - s[\"bbox\"][1]))\n\n\ndef replace_span(pdf_bytes, index, bbox, new_text, size=None, color=None, password=None):\n    \"\"\"Replace one run of text: remove the old glyphs, write the new ones in place.\n\n    The original font is not always embeddable, so the replacement is set in\n    Helvetica at the same size and colour.\n    \"\"\"\n    with _open(pdf_bytes, password) as doc:\n        page = doc[index]\n        rect = fitz.Rect(bbox)\n        page.add_redact_annot(rect)\n        try:\n            page.apply_redactions(images=0, graphics=0)\n        except TypeError:  # older PyMuPDF\n            page.apply_redactions()\n\n        if new_text.strip():\n            font = fitz.Font(\"helv\")\n            size = size or max(6, rect.height * 0.82)\n            # shrink to fit if the new text is longer than the space it replaces\n            while size > 4 and font.text_length(new_text, size) > rect.width * 1.6:\n                size -= 0.5\n            writer = fitz.TextWriter(page.rect)\n            writer.append(fitz.Point(rect.x0, rect.y1 - rect.height * 0.18), new_text,\n                          font=font, fontsize=size)\n            writer.write_text(page, color=color or (0, 0, 0))\n        return doc.tobytes(garbage=4, deflate=True)\n\n\ndef add_text_at(pdf_bytes, index, point, text, size=14, color=\"#1B1F35\",\n                opacity=1.0, password=None):\n    \"\"\"Write text with its top-left corner at `point`.\"\"\"\n    if not text.strip():\n        raise ValueError(\"Enter some text first.\")\n    font = fitz.Font(\"helv\")\n    with _open(pdf_bytes, password) as doc:\n        page = doc[index]\n        writer = fitz.TextWriter(page.rect)\n        for row, line in enumerate(text.splitlines() or [text]):\n            if line.strip():\n                writer.append(fitz.Point(point[0], point[1] + size * (row + 1)), line,\n                              font=font, fontsize=size)\n        writer.write_text(page, color=hex_to_rgb(color), opacity=opacity)\n        return doc.tobytes(garbage=4, deflate=True)\n",
