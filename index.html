<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PDF Toolkit</title>
<meta name="description" content="Edit, convert and organise PDFs. Runs entirely in your browser." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128196;</text></svg>" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.css" />
<style>
  html, body { margin: 0; height: 100%; }
  #boot {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.1rem; background: #F6F7FB; color: #1B1F35;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    transition: opacity .4s ease;
  }
  #boot.done { opacity: 0; pointer-events: none; }
  .badge {
    width: 62px; height: 62px; border-radius: 18px;
    background: linear-gradient(135deg, #4F46E5 0%, #7C6BF5 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 30px rgba(79,70,229,.35);
  }
  .title { font-size: 1.35rem; font-weight: 700; letter-spacing: -.02em; }
  .sub { color: #6B7192; font-size: .92rem; max-width: 30rem; text-align: center;
         line-height: 1.55; padding: 0 1.5rem; }
  .bar { width: 210px; height: 5px; border-radius: 999px; background: #E5E7F0; overflow: hidden; }
  .bar span {
    display: block; width: 40%; height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, #4F46E5, #7C6BF5);
    animation: slide 1.25s ease-in-out infinite;
  }
  @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(360%); } }
  .note { color: #8A90AC; font-size: .78rem; }
</style>
</head>
<body>
<div id="boot">
  <div class="badge">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="15"/>
    </svg>
  </div>
  <div class="title">PDF Toolkit</div>
  <div class="bar"><span></span></div>
  <div class="sub">Setting up. The first visit downloads the PDF engine, then it is
    cached and opens straight away.</div>
  <div class="note">Your files never leave this device.</div>
</div>

<div id="root"></div>

<script type="module">
import * as stlite from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.js";

stlite.mount({
  "entrypoint": "app.py",
  "requirements": [
    "pymupdf",
    "pillow",
    "streamlit-image-coordinates"
  ],
  "files": {
    "app.py": "\"\"\"PDF Toolkit -- Streamlit interface.\"\"\"\n\nimport io\nimport zipfile\n\nimport streamlit as st\n\nimport editor\nimport ops\nimport ui\n\nPREVIEW_LIMIT = 12\n\n\n# --- helpers ---------------------------------------------------------------\n\n\ndef zip_bytes(files):\n    buf = io.BytesIO()\n    with zipfile.ZipFile(buf, \"w\", zipfile.ZIP_DEFLATED) as zf:\n        for name, data in files:\n            zf.writestr(name, data)\n    return buf.getvalue()\n\n\ndef human_size(num):\n    return f\"{num / 1e6:.2f} MB\" if num >= 1e6 else f\"{num / 1e3:.0f} KB\"\n\n\ndef stem(name):\n    return name.rsplit(\".\", 1)[0]\n\n\ndef sig(up, *params):\n    \"\"\"A cheap fingerprint of the inputs, used to discard stale results.\"\"\"\n    files = up if isinstance(up, list) else [up]\n    return tuple((f.name, f.size) for f in files if f) + params\n\n\ndef upload_pdf(label=\"Choose a PDF file\", multiple=False):\n    \"\"\"Uploader plus a password box that appears only when the PDF is locked.\"\"\"\n    up = st.file_uploader(label, type=\"pdf\", accept_multiple_files=multiple)\n    if multiple or not up:\n        return up, None\n    password = None\n    try:\n        ops.page_count(up.getvalue())\n    except ValueError:\n        st.warning(\"This PDF is password protected.\", icon=\":material/lock:\")\n        password = st.text_input(\"Password\", type=\"password\", placeholder=\"Enter the password\")\n    return up, password\n\n\ndef run_button(key, signature, work, label=\"Run\", icon=None):\n    \"\"\"Run `work` on click and remember the result across the reruns that\n    downloading causes. A change to `signature` discards a stale result.\"\"\"\n    stored = st.session_state.get(key)\n    if stored is not None and stored[0] != signature:\n        st.session_state.pop(key, None)\n        stored = None\n\n    if st.button(label, type=\"primary\", icon=icon, width=\"stretch\"):\n        try:\n            with st.spinner(\"Working on it...\"):\n                st.session_state[key] = (signature, work())\n            stored = st.session_state[key]\n        except Exception as exc:  # show the message, not a traceback\n            st.session_state.pop(key, None)\n            st.error(str(exc), icon=\":material/error:\")\n            return None\n\n    return stored[1] if stored else None\n\n\ndef result_card(message):\n    st.markdown(\"\")\n    st.success(message, icon=\":material/check_circle:\")\n\n\ndef download(data, filename, mime=\"application/pdf\", label=None, primary=False):\n    st.download_button(\n        label or \"Download\",\n        data,\n        file_name=filename,\n        mime=mime,\n        icon=\":material/download:\",\n        width=\"stretch\",\n        type=\"primary\" if primary else \"secondary\",\n    )\n\n\ndef file_meta(up):\n    st.caption(f\"{up.name} \u00b7 {human_size(up.size)}\")\n\n\n# --- tools -----------------------------------------------------------------\n\n\ndef tool_pdf_to_jpg():\n    with st.container(border=True):\n        ui.step(1, \"Choose your PDF\")\n        up, pw = upload_pdf()\n        if up:\n            file_meta(up)\n\n        ui.step(2, \"Image settings\")\n        c1, c2 = st.columns(2)\n        dpi = c1.slider(\"Resolution (DPI)\", 72, 400, ops.DPI,\n                        help=\"150 for screen, 300 for print.\")\n        quality = c2.slider(\"JPG quality\", 50, 100, ops.QUALITY)\n\n        if not up:\n            return\n        ui.step(3, \"Convert\")\n        pages = run_button(\n            \"jpg\", sig(up, dpi, quality, pw),\n            lambda: ops.pdf_to_jpgs(up.getvalue(), dpi=dpi, quality=quality, password=pw),\n            \"Convert to JPG\", \":material/bolt:\",\n        )\n\n    if not pages:\n        return\n    result_card(f\"{len(pages)} pages converted\")\n    with st.container(border=True):\n        download(zip_bytes(pages), f\"{stem(up.name)}_jpg.zip\", \"application/zip\",\n                 f\"Download all {len(pages)} images (ZIP)\", primary=True)\n        st.markdown(\"\")\n        for name, data in pages[:PREVIEW_LIMIT]:\n            st.image(data, caption=name)\n            download(data, name, \"image/jpeg\", f\"Download {name}\")\n        if len(pages) > PREVIEW_LIMIT:\n            st.info(f\"Previewing the first {PREVIEW_LIMIT} pages. \"\n                    f\"The ZIP contains all {len(pages)}.\", icon=\":material/visibility:\")\n\n\ndef tool_images_to_pdf():\n    with st.container(border=True):\n        ui.step(1, \"Choose your images\")\n        ups = st.file_uploader(\n            \"Images\", type=[\"jpg\", \"jpeg\", \"png\", \"bmp\", \"gif\", \"tiff\", \"webp\"],\n            accept_multiple_files=True,\n        )\n        if not ups:\n            return\n        ui.step(2, \"Page order\")\n        ui.chips([f.name for f in ups])\n        st.caption(\"Pages follow the order shown. Re-upload in a different order to change it.\")\n\n        ui.step(3, \"Create\")\n        data = run_button(\n            \"img2pdf\", sig(ups),\n            lambda: ops.images_to_pdf([(f.name, f.getvalue()) for f in ups]),\n            \"Create PDF\", \":material/picture_as_pdf:\",\n        )\n\n    if data:\n        result_card(f\"PDF created from {len(ups)} images\")\n        with st.container(border=True):\n            download(data, \"images.pdf\", label=\"Download PDF\", primary=True)\n\n\ndef tool_merge():\n    with st.container(border=True):\n        ui.step(1, \"Choose two or more PDFs\")\n        ups = st.file_uploader(\"PDF files\", type=\"pdf\", accept_multiple_files=True)\n        if not ups:\n            return\n        ui.step(2, \"Merge order\")\n        ui.chips([f.name for f in ups])\n        if len(ups) < 2:\n            st.info(\"Add at least one more PDF to merge.\", icon=\":material/add:\")\n            return\n\n        ui.step(3, \"Merge\")\n        data = run_button(\n            \"merge\", sig(ups),\n            lambda: ops.merge_pdfs([(f.name, f.getvalue()) for f in ups]),\n            \"Merge PDFs\", \":material/merge:\",\n        )\n\n    if data:\n        result_card(f\"{len(ups)} files merged into one\")\n        with st.container(border=True):\n            download(data, \"merged.pdf\", label=\"Download merged PDF\", primary=True)\n\n\ndef tool_split():\n    with st.container(border=True):\n        ui.step(1, \"Choose your PDF\")\n        up, pw = upload_pdf()\n        if not up:\n            return\n        file_meta(up)\n\n        ui.step(2, \"Split\")\n        parts = run_button(\n            \"split\", sig(up, pw),\n            lambda: ops.split_to_pages(up.getvalue(), password=pw),\n            \"Split into single pages\", \":material/content_cut:\",\n        )\n\n    if parts:\n        result_card(f\"Split into {len(parts)} files\")\n        with st.container(border=True):\n            download(zip_bytes(parts), f\"{stem(up.name)}_split.zip\", \"application/zip\",\n                     f\"Download all {len(parts)} PDFs (ZIP)\", primary=True)\n\n\ndef _pages_input(up, pw, help_text):\n    \"\"\"Page-count caption plus the page selector. Returns None on a locked file.\"\"\"\n    try:\n        total = ops.page_count(up.getvalue(), pw)\n    except ValueError as exc:\n        st.error(str(exc), icon=\":material/lock:\")\n        return None\n    st.caption(f\"{up.name} \u00b7 {total} pages \u00b7 {human_size(up.size)}\")\n    return st.text_input(\"Pages\", placeholder=\"e.g. 1-3, 5, 8-10\", help=help_text)\n\n\ndef tool_extract():\n    with st.container(border=True):\n        ui.step(1, \"Choose your PDF\")\n        up, pw = upload_pdf()\n        if not up:\n            return\n        ui.step(2, \"Pages to keep\")\n        spec = _pages_input(up, pw, \"Leave empty to keep every page.\")\n        if spec is None:\n            return\n\n        ui.step(3, \"Extract\")\n        data = run_button(\n            \"extract\", sig(up, spec, pw),\n            lambda: ops.extract_pages(up.getvalue(), spec, password=pw),\n            \"Extract pages\", \":material/file_copy:\",\n        )\n\n    if data:\n        result_card(\"Pages extracted\")\n        with st.container(border=True):\n            download(data, f\"{stem(up.name)}_extracted.pdf\", label=\"Download PDF\", primary=True)\n\n\ndef tool_delete():\n    with st.container(border=True):\n        ui.step(1, \"Choose your PDF\")\n        up, pw = upload_pdf()\n        if not up:\n            return\n        ui.step(2, \"Pages to remove\")\n        spec = _pages_input(up, pw, \"These pages are deleted. Everything else is kept.\")\n        if spec is None:\n            return\n        if not spec.strip():\n            st.info(\"Enter which pages to delete.\", icon=\":material/edit:\")\n            return\n\n        ui.step(3, \"Delete\")\n        data = run_button(\n            \"delete\", sig(up, spec, pw),\n            lambda: ops.delete_pages(up.getvalue(), spec, password=pw),\n            \"Delete pages\", \":material/delete:\",\n        )\n\n    if data:\n        result_card(\"Pages removed\")\n        with st.container(border=True):\n            download(data, f\"{stem(up.name)}_edited.pdf\", label=\"Download PDF\", primary=True)\n\n\ndef tool_rotate():\n    with st.container(border=True):\n        ui.step(1, \"Choose your PDF\")\n        up, pw = upload_pdf()\n        if not up:\n            return\n        ui.step(2, \"Pages to rotate\")\n        spec = _pages_input(up, pw, \"Leave empty to rotate every page.\")\n        if spec is None:\n            return\n\n        ui.step(3, \"Direction\")\n        angle = st.radio(\"Rotate by\", [90, 180, 270], horizontal=True,\n                         format_func=lambda a: f\"{a}\u00b0\", label_visibility=\"collapsed\")\n\n        data = run_button(\n            \"rotate\", sig(up, spec, angle, pw),\n            lambda: ops.rotate_pages(up.getvalue(), spec, angle, password=pw),\n            \"Rotate pages\", \":material/rotate_right:\",\n        )\n\n    if data:\n        result_card(\"Pages rotated\")\n        with st.container(border=True):\n            download(data, f\"{stem(up.name)}_rotated.pdf\", label=\"Download PDF\", primary=True)\n\n\ndef tool_compress():\n    with st.container(border=True):\n        ui.step(1, \"Choose your PDF\")\n        up, pw = upload_pdf()\n        if up:\n            file_meta(up)\n\n        ui.step(2, \"Method\")\n        mode = st.radio(\n            \"Method\",\n            [\"Lossless cleanup\", \"Aggressive (rasterise pages)\"],\n            label_visibility=\"collapsed\",\n            captions=[\n                \"Safe. Text stays selectable and searchable.\",\n                \"Much smaller files, but pages become images.\",\n            ],\n        )\n        raster = mode.startswith(\"Aggressive\")\n        dpi, quality = 150, 70\n        if raster:\n            c1, c2 = st.columns(2)\n            dpi = c1.slider(\"Resolution (DPI)\", 72, 300, 150)\n            quality = c2.slider(\"JPG quality\", 30, 95, 70)\n\n        if not up:\n            return\n        ui.step(3, \"Compress\")\n        data = run_button(\n            \"compress\", sig(up, raster, dpi, quality, pw),\n            lambda: ops.compress(up.getvalue(), password=pw, rasterize=raster,\n                                 dpi=dpi, quality=quality),\n            \"Compress PDF\", \":material/compress:\",\n        )\n\n    if data is None:\n        return\n    before, after = up.size, len(data)\n    change = (after - before) / before * 100\n    result_card(\"Compression finished\")\n    with st.container(border=True):\n        c1, c2 = st.columns(2)\n        c1.metric(\"Before\", human_size(before))\n        c2.metric(\"After\", human_size(after), f\"{change:.0f}%\", delta_color=\"inverse\")\n        if after >= before:\n            st.warning(\"This PDF is already well optimised, so it did not get smaller. \"\n                       \"Try the aggressive method.\", icon=\":material/info:\")\n        st.markdown(\"\")\n        download(data, f\"{stem(up.name)}_compressed.pdf\", label=\"Download PDF\", primary=True)\n\n\ndef tool_password():\n    with st.container(border=True):\n        ui.step(1, \"What do you want to do?\")\n        action = st.radio(\"Action\", [\"Add a password\", \"Remove a password\"],\n                          horizontal=True, label_visibility=\"collapsed\")\n        ui.step(2, \"Choose your PDF\")\n        up = st.file_uploader(\"PDF file\", type=\"pdf\")\n        if not up:\n            return\n        file_meta(up)\n\n        if action == \"Add a password\":\n            ui.step(3, \"Set the password\")\n            new_pw = st.text_input(\"New password\", type=\"password\",\n                                   placeholder=\"Choose a strong password\")\n            data = run_button(\n                \"protect\", sig(up, new_pw),\n                lambda: ops.add_password(up.getvalue(), new_pw),\n                \"Protect PDF\", \":material/lock:\",\n            )\n            name, note = f\"{stem(up.name)}_protected.pdf\", \"Password added (AES-256)\"\n        else:\n            ui.step(3, \"Enter the current password\")\n            pw = st.text_input(\"Current password\", type=\"password\")\n            data = run_button(\n                \"unlock\", sig(up, pw),\n                lambda: ops.remove_password(up.getvalue(), pw),\n                \"Unlock PDF\", \":material/lock_open:\",\n            )\n            name, note = f\"{stem(up.name)}_unlocked.pdf\", \"Password removed\"\n\n    if data:\n        result_card(note)\n        with st.container(border=True):\n            download(data, name, label=\"Download PDF\", primary=True)\n\n\ndef tool_text():\n    with st.container(border=True):\n        ui.step(1, \"Choose your PDF\")\n        up, pw = upload_pdf()\n        if not up:\n            return\n        file_meta(up)\n\n        ui.step(2, \"Extract\")\n        text = run_button(\n            \"text\", sig(up, pw),\n            lambda: ops.extract_text(up.getvalue(), password=pw),\n            \"Extract text\", \":material/notes:\",\n        )\n\n    if text is None:\n        return\n    if not text.replace(\"-\", \"\").replace(\"Page\", \"\").strip().strip(\"0123456789\"):\n        st.warning(\"No text found. This PDF is most likely made of scanned images, \"\n                   \"which need OCR.\", icon=\":material/scanner:\")\n    result_card(f\"{len(text.split())} words extracted\")\n    with st.container(border=True):\n        download(text, f\"{stem(up.name)}.txt\", \"text/plain\",\n                 \"Download as .txt\", primary=True)\n        st.text_area(\"Preview\", text, height=380, label_visibility=\"collapsed\")\n\n\ndef tool_info():\n    with st.container(border=True):\n        ui.step(1, \"Choose your PDF\")\n        up, pw = upload_pdf()\n        if not up:\n            return\n        try:\n            info = ops.pdf_info(up.getvalue(), pw)\n        except ValueError as exc:\n            st.error(str(exc), icon=\":material/lock:\")\n            return\n\n    with st.container(border=True):\n        c1, c2 = st.columns(2)\n        c1.metric(\"Pages\", info[\"Pages\"])\n        c2.metric(\"File size\", human_size(up.size))\n        st.markdown(\"\")\n        ui.info_rows(\n            [(\"File name\", up.name)]\n            + [(k, v) for k, v in info.items() if k != \"Pages\"]\n        )\n\n\n# --- editor ----------------------------------------------------------------\n\nEDIT_ACTIONS = [\n    \"Add text\", \"Add image or signature\", \"Add watermark\", \"Add page numbers\",\n    \"Highlight text\", \"Redact text\", \"Reorder pages\",\n]\n\n\n@st.cache_data(show_spinner=False, max_entries=24)\ndef preview_page(data, index, dpi=110):\n    return ops.render_preview(data, index, dpi=dpi)\n\n\ndef edit_current():\n    return st.session_state.edit_stack[-1]\n\n\ndef edit_apply(label, icon, key, work):\n    \"\"\"Run an edit, push it onto the history, and refresh the preview.\"\"\"\n    if not st.button(label, icon=icon, type=\"primary\", width=\"stretch\", key=key):\n        return\n    try:\n        with st.spinner(\"Applying...\"):\n            result = work(edit_current())\n        data, note = result if isinstance(result, tuple) else (result, \"Change applied\")\n        st.session_state.edit_stack.append(data)\n        st.toast(note, icon=\":material/check_circle:\")\n        st.rerun()\n    except Exception as exc:\n        st.error(str(exc), icon=\":material/error:\")\n\n\ndef edit_start(up):\n    \"\"\"Begin (or restart) an editing session for the uploaded file.\"\"\"\n    signature = (up.name, up.size)\n    if st.session_state.get(\"edit_sig\") == signature:\n        return True\n\n    data = up.getvalue()\n    try:\n        ops.page_count(data)\n    except ValueError:\n        st.warning(\"This PDF is password protected.\", icon=\":material/lock:\")\n        pw = st.text_input(\"Password\", type=\"password\", key=\"edit_pw\")\n        if not pw:\n            return False\n        try:\n            data = ops.remove_password(data, pw)\n            st.caption(\"Unlocked. The edited copy will be saved without the password.\")\n        except ValueError as exc:\n            st.error(str(exc), icon=\":material/lock:\")\n            return False\n\n    st.session_state.edit_sig = signature\n    st.session_state.edit_stack = [data]\n    st.session_state.edit_page = 1\n    return True\n\n\ndef tool_edit():\n    with st.container(border=True):\n        ui.step(1, \"Choose the PDF you want to edit\")\n        up = st.file_uploader(\"PDF file\", type=\"pdf\")\n        if not up:\n            st.session_state.pop(\"edit_sig\", None)\n            return\n        if not edit_start(up):\n            return\n\n    data = edit_current()\n    total = ops.page_count(data)\n    edits = len(st.session_state.edit_stack) - 1\n\n    controls, preview = st.columns([1, 0.9], gap=\"medium\")\n\n    with controls:\n        with st.container(border=True):\n            ui.step(2, \"Choose what to change\")\n            action = st.pills(\"Action\", EDIT_ACTIONS, default=EDIT_ACTIONS[0],\n                              label_visibility=\"collapsed\") or EDIT_ACTIONS[0]\n            st.markdown(\"\")\n            EDIT_RENDER[action](total)\n\n        with st.container(border=True):\n            c1, c2 = st.columns(2)\n            if c1.button(\"Undo\", icon=\":material/undo:\", width=\"stretch\",\n                         disabled=edits == 0):\n                st.session_state.edit_stack.pop()\n                st.rerun()\n            if c2.button(\"Start over\", icon=\":material/restart_alt:\", width=\"stretch\",\n                         disabled=edits == 0):\n                del st.session_state.edit_stack[1:]\n                st.rerun()\n            st.caption(f\"{edits} change{'s' if edits != 1 else ''} applied\")\n            download(data, f\"{stem(up.name)}_edited.pdf\",\n                     label=\"Download edited PDF\", primary=True)\n\n    with preview:\n        with st.container(border=True):\n            head, nav = st.columns([1, 1])\n            head.markdown(\"**Live preview**\")\n            page = nav.number_input(\"Page\", 1, total, min(st.session_state.edit_page, total),\n                                    label_visibility=\"collapsed\")\n            st.session_state.edit_page = page\n            st.image(preview_page(data, page - 1))\n            st.caption(f\"Page {page} of {total} \u00b7 {human_size(len(data))}\")\n\n\ndef _pages_field(total, label=\"Pages\", help_text=\"Leave empty for every page.\"):\n    return st.text_input(label, placeholder=f\"all pages (1-{total})\", help=help_text)\n\n\ndef _position_field(default=\"Bottom centre\"):\n    c1, c2 = st.columns([1, 1])\n    position = c1.selectbox(\"Position\", ops.POSITIONS, index=ops.POSITIONS.index(default))\n    margin = c2.slider(\"Margin (pt)\", 0, 120, 36)\n    return position, margin\n\n\ndef edit_add_text(total):\n    text = st.text_area(\"Text\", placeholder=\"Approved by...\", height=90)\n    position, margin = _position_field(\"Top right\")\n    c1, c2 = st.columns(2)\n    size = c1.slider(\"Size\", 6, 72, 14)\n    colour = c2.color_picker(\"Colour\", \"#1B1F35\")\n    opacity = st.slider(\"Opacity\", 0.1, 1.0, 1.0, 0.05)\n    spec = _pages_field(total)\n    edit_apply(\"Add text\", \":material/title:\", \"e_text\",\n               lambda d: ops.add_text(d, spec, text, position, size, colour, opacity, margin))\n\n\ndef edit_add_image(total):\n    img = st.file_uploader(\"Image\", type=[\"png\", \"jpg\", \"jpeg\", \"webp\"], key=\"edit_img\")\n    st.caption(\"A PNG with a transparent background works best for signatures.\")\n    position, margin = _position_field(\"Bottom right\")\n    c1, c2 = st.columns(2)\n    width = c1.slider(\"Width (% of page)\", 5, 100, 25)\n    opacity = c2.slider(\"Opacity\", 0.1, 1.0, 1.0, 0.05, key=\"img_op\")\n    spec = _pages_field(total)\n    if not img:\n        st.info(\"Upload an image to place on the page.\", icon=\":material/image:\")\n        return\n    edit_apply(\"Place image\", \":material/add_photo_alternate:\", \"e_img\",\n               lambda d: ops.add_image(d, spec, img.getvalue(), position, width,\n                                       opacity, margin))\n\n\ndef edit_watermark(total):\n    text = st.text_input(\"Watermark text\", value=\"DRAFT\")\n    c1, c2 = st.columns(2)\n    size = c1.slider(\"Size\", 20, 140, 60)\n    angle = c2.slider(\"Angle\", 0, 90, 45)\n    c3, c4 = st.columns(2)\n    colour = c3.color_picker(\"Colour\", \"#9AA0BD\", key=\"wm_col\")\n    opacity = c4.slider(\"Opacity\", 0.05, 1.0, 0.25, 0.05, key=\"wm_op\")\n    spec = _pages_field(total)\n    edit_apply(\"Add watermark\", \":material/branding_watermark:\", \"e_wm\",\n               lambda d: ops.add_watermark(d, text, spec, size, colour, opacity, angle))\n\n\ndef edit_page_numbers(total):\n    style = st.selectbox(\"Style\", list(ops.NUMBER_FORMATS))\n    position, margin = _position_field(\"Bottom centre\")\n    c1, c2 = st.columns(2)\n    start = c1.number_input(\"Start at\", 1, 9999, 1)\n    size = c2.slider(\"Size\", 6, 24, 10, key=\"pn_size\")\n    c3, c4 = st.columns(2)\n    colour = c3.color_picker(\"Colour\", \"#6B7192\", key=\"pn_col\")\n    skip = c4.checkbox(\"Skip the first page\")\n    edit_apply(\"Add page numbers\", \":material/tag:\", \"e_pn\",\n               lambda d: ops.add_page_numbers(d, position, start, ops.NUMBER_FORMATS[style],\n                                              size, colour, margin, skip))\n\n\ndef edit_highlight(total):\n    query = st.text_input(\"Text to highlight\")\n    colour = st.color_picker(\"Highlight colour\", \"#FFE066\", key=\"hl_col\")\n    if query:\n        try:\n            found = ops.find_text(edit_current(), query)\n            st.caption(f\"Found {sum(n for _, n in found)} times on \"\n                       f\"{len(found)} page{'s' if len(found) != 1 else ''}.\"\n                       if found else \"Not found in this PDF.\")\n        except ValueError:\n            pass\n    edit_apply(\"Highlight\", \":material/format_ink_highlighter:\", \"e_hl\",\n               lambda d: (lambda r: (r[0], f\"Highlighted {r[1]} matches\"))(\n                   ops.highlight_text(d, query, colour)))\n\n\ndef edit_redact(total):\n    query = st.text_input(\"Text to remove permanently\")\n    colour = st.color_picker(\"Box colour\", \"#000000\", key=\"rd_col\")\n    st.warning(\"Redaction deletes the text from the file, not just hides it. \"\n               \"This cannot be undone once you download.\", icon=\":material/warning:\")\n    if query:\n        try:\n            found = ops.find_text(edit_current(), query)\n            st.caption(f\"Found {sum(n for _, n in found)} times on \"\n                       f\"{len(found)} page{'s' if len(found) != 1 else ''}.\"\n                       if found else \"Not found in this PDF.\")\n        except ValueError:\n            pass\n    edit_apply(\"Redact\", \":material/ink_eraser:\", \"e_rd\",\n               lambda d: (lambda r: (r[0], f\"Redacted {r[1]} matches\"))(\n                   ops.redact_text(d, query, colour)))\n\n\ndef edit_reorder(total):\n    st.caption(f\"This PDF has {total} pages. Give the new order, for example \"\n               f\"`{total},1-{max(total - 1, 1)}` to move the last page to the front.\")\n    spec = st.text_input(\"New page order\", placeholder=f\"1-{total}\")\n    if not spec.strip():\n        st.info(\"Enter the order you want.\", icon=\":material/reorder:\")\n        return\n    edit_apply(\"Apply order\", \":material/reorder:\", \"e_ro\",\n               lambda d: ops.reorder_pages(d, spec))\n\n\nEDIT_RENDER = {\n    \"Add text\": edit_add_text,\n    \"Add image or signature\": edit_add_image,\n    \"Add watermark\": edit_watermark,\n    \"Add page numbers\": edit_page_numbers,\n    \"Highlight text\": edit_highlight,\n    \"Redact text\": edit_redact,\n    \"Reorder pages\": edit_reorder,\n}\n\n\n# --- main ------------------------------------------------------------------\n\nRENDER = {\n    \"PDF to JPG\": tool_pdf_to_jpg,\n    \"Images to PDF\": tool_images_to_pdf,\n    \"Extract text\": tool_text,\n    \"Edit PDF\": editor.render,\n    \"Apply to all pages\": tool_edit,\n    \"Merge PDFs\": tool_merge,\n    \"Split PDF\": tool_split,\n    \"Extract pages\": tool_extract,\n    \"Delete pages\": tool_delete,\n    \"Rotate pages\": tool_rotate,\n    \"Compress PDF\": tool_compress,\n    \"Protect / Unlock\": tool_password,\n    \"PDF info\": tool_info,\n}\n\nui.setup()\nst.session_state.setdefault(\"tool\", \"PDF to JPG\")\ntool = ui.sidebar_nav(st.session_state.tool)\n\nui.page_head(tool)\nRENDER[tool]()\n",
    "ops.py": "\"\"\"PDF operations. Pure functions on bytes -- no UI code here.\"\"\"\n\nimport fitz  # PyMuPDF\n\nDPI = 200\nQUALITY = 90\n\n\ndef _open(pdf_bytes, password=None):\n    \"\"\"Open a PDF, unlocking it first if it is password protected.\"\"\"\n    doc = fitz.open(stream=pdf_bytes, filetype=\"pdf\")\n    if doc.needs_pass and not doc.authenticate(password or \"\"):\n        doc.close()\n        raise ValueError(\"This PDF is password protected. Enter the correct password.\")\n    return doc\n\n\ndef page_count(pdf_bytes, password=None):\n    with _open(pdf_bytes, password) as doc:\n        return doc.page_count\n\n\ndef parse_pages(spec, total):\n    \"\"\"Turn a page spec like '1-3,5' into zero-based indices. Empty means all pages.\"\"\"\n    spec = (spec or \"\").strip()\n    if not spec:\n        return list(range(total))\n\n    pages = []\n    for part in spec.split(\",\"):\n        part = part.strip()\n        if not part:\n            continue\n        try:\n            if \"-\" in part:\n                start_text, _, end_text = part.partition(\"-\")\n                start, end = int(start_text), int(end_text)\n            else:\n                start = end = int(part)\n        except ValueError:\n            raise ValueError(f\"'{part}' is not a page number or range.\") from None\n        if start < 1 or end > total or start > end:\n            raise ValueError(f\"'{part}' is out of range for a {total}-page PDF.\")\n        pages.extend(range(start - 1, end))\n\n    if not pages:\n        raise ValueError(\"No pages selected.\")\n    return sorted(set(pages))\n\n\ndef pdf_to_jpgs(pdf_bytes, dpi=DPI, quality=QUALITY, password=None):\n    \"\"\"One JPG per page. Returns [(filename, jpg_bytes), ...].\"\"\"\n    with _open(pdf_bytes, password) as doc:\n        return [\n            (f\"page_{i:03d}.jpg\", page.get_pixmap(dpi=dpi).tobytes(\"jpg\", jpg_quality=quality))\n            for i, page in enumerate(doc, start=1)\n        ]\n\n\ndef images_to_pdf(images):\n    \"\"\"Build a PDF from [(filename, image_bytes), ...], one image per page.\"\"\"\n    if not images:\n        raise ValueError(\"No images given.\")\n\n    out = fitz.open()\n    for name, data in images:\n        ext = name.rsplit(\".\", 1)[-1].lower()\n        with fitz.open(stream=data, filetype=ext) as img:\n            rect = img[0].rect\n            pdf_bytes = img.convert_to_pdf()\n        with fitz.open(\"pdf\", pdf_bytes) as page_pdf:\n            out.new_page(width=rect.width, height=rect.height).show_pdf_page(rect, page_pdf, 0)\n\n    data = out.tobytes(garbage=4, deflate=True)\n    out.close()\n    return data\n\n\ndef merge_pdfs(pdfs):\n    \"\"\"Join [(filename, pdf_bytes), ...] into one PDF, in the order given.\"\"\"\n    if not pdfs:\n        raise ValueError(\"No PDFs given.\")\n\n    out = fitz.open()\n    for name, data in pdfs:\n        try:\n            with _open(data) as doc:\n                out.insert_pdf(doc)\n        except ValueError:\n            out.close()\n            raise ValueError(f\"'{name}' is password protected -- unlock it first.\") from None\n\n    data = out.tobytes(garbage=4, deflate=True)\n    out.close()\n    return data\n\n\ndef split_to_pages(pdf_bytes, password=None):\n    \"\"\"One single-page PDF per page. Returns [(filename, pdf_bytes), ...].\"\"\"\n    with _open(pdf_bytes, password) as doc:\n        results = []\n        for i in range(doc.page_count):\n            single = fitz.open()\n            single.insert_pdf(doc, from_page=i, to_page=i)\n            results.append((f\"page_{i + 1:03d}.pdf\", single.tobytes(garbage=4, deflate=True)))\n            single.close()\n        return results\n\n\ndef extract_pages(pdf_bytes, spec, password=None):\n    \"\"\"A new PDF holding only the selected pages.\"\"\"\n    with _open(pdf_bytes, password) as doc:\n        pages = parse_pages(spec, doc.page_count)\n        out = fitz.open()\n        for i in pages:\n            out.insert_pdf(doc, from_page=i, to_page=i)\n        data = out.tobytes(garbage=4, deflate=True)\n        out.close()\n        return data\n\n\ndef delete_pages(pdf_bytes, spec, password=None):\n    \"\"\"A new PDF with the selected pages removed.\"\"\"\n    with _open(pdf_bytes, password) as doc:\n        drop = set(parse_pages(spec, doc.page_count))\n        keep = [i for i in range(doc.page_count) if i not in drop]\n        if not keep:\n            raise ValueError(\"That would delete every page.\")\n        doc.delete_pages(sorted(drop))\n        return doc.tobytes(garbage=4, deflate=True)\n\n\ndef rotate_pages(pdf_bytes, spec, angle, password=None):\n    \"\"\"Rotate the selected pages by 90, 180 or 270 degrees.\"\"\"\n    if angle % 90:\n        raise ValueError(\"Rotation must be a multiple of 90 degrees.\")\n    with _open(pdf_bytes, password) as doc:\n        for i in parse_pages(spec, doc.page_count):\n            page = doc[i]\n            page.set_rotation((page.rotation + angle) % 360)\n        return doc.tobytes(garbage=4, deflate=True)\n\n\ndef compress(pdf_bytes, password=None, rasterize=False, dpi=150, quality=70):\n    \"\"\"Shrink a PDF. Rasterizing compresses far more but turns text into images.\"\"\"\n    with _open(pdf_bytes, password) as doc:\n        if not rasterize:\n            return doc.tobytes(garbage=4, deflate=True, clean=True)\n\n        out = fitz.open()\n        for page in doc:\n            pix = page.get_pixmap(dpi=dpi)\n            with fitz.open(stream=pix.tobytes(\"jpg\", jpg_quality=quality), filetype=\"jpg\") as img:\n                pdf_page = img.convert_to_pdf()\n            with fitz.open(\"pdf\", pdf_page) as page_pdf:\n                out.new_page(width=page.rect.width, height=page.rect.height).show_pdf_page(\n                    page.rect, page_pdf, 0\n                )\n        data = out.tobytes(garbage=4, deflate=True)\n        out.close()\n        return data\n\n\ndef add_password(pdf_bytes, new_password, password=None):\n    \"\"\"Encrypt with AES-256.\"\"\"\n    if not new_password:\n        raise ValueError(\"Enter a password to set.\")\n    with _open(pdf_bytes, password) as doc:\n        return doc.tobytes(\n            encryption=fitz.PDF_ENCRYPT_AES_256,\n            owner_pw=new_password,\n            user_pw=new_password,\n            garbage=4,\n            deflate=True,\n        )\n\n\ndef remove_password(pdf_bytes, password):\n    \"\"\"Strip encryption, given the current password.\"\"\"\n    with _open(pdf_bytes, password) as doc:\n        return doc.tobytes(encryption=fitz.PDF_ENCRYPT_NONE, garbage=4, deflate=True)\n\n\ndef extract_text(pdf_bytes, password=None):\n    \"\"\"Plain text of the whole document, with a header per page.\"\"\"\n    with _open(pdf_bytes, password) as doc:\n        return \"\\n\\n\".join(\n            f\"--- Page {i} ---\\n{page.get_text().strip()}\" for i, page in enumerate(doc, start=1)\n        )\n\n\ndef pdf_info(pdf_bytes, password=None):\n    \"\"\"Basic metadata for display.\"\"\"\n    with _open(pdf_bytes, password) as doc:\n        meta = doc.metadata or {}\n        first = doc[0].rect if doc.page_count else None\n        return {\n            \"Pages\": doc.page_count,\n            \"Title\": meta.get(\"title\") or \"-\",\n            \"Author\": meta.get(\"author\") or \"-\",\n            \"Producer\": meta.get(\"producer\") or \"-\",\n            \"Created\": meta.get(\"creationDate\") or \"-\",\n            \"Encrypted\": \"Yes\" if doc.needs_pass else \"No\",\n            \"First page size\": f\"{first.width:.0f} x {first.height:.0f} pt\" if first else \"-\",\n        }\n\n\n# --- editing ---------------------------------------------------------------\n\nPOSITIONS = [\n    \"Top left\", \"Top centre\", \"Top right\",\n    \"Middle left\", \"Centre\", \"Middle right\",\n    \"Bottom left\", \"Bottom centre\", \"Bottom right\",\n]\n\nNUMBER_FORMATS = {\"1\": \"{n}\", \"Page 1\": \"Page {n}\", \"1 / 10\": \"{n} / {total}\"}\n\n\ndef hex_to_rgb(value):\n    \"\"\"'#4F46E5' -> (0.31, 0.27, 0.90).\"\"\"\n    value = value.lstrip(\"#\")\n    return tuple(int(value[i:i + 2], 16) / 255 for i in (0, 2, 4))\n\n\ndef parse_order(spec, total):\n    \"\"\"Like parse_pages but keeps your order and allows repeats: '3,1,1' -> [2,0,0].\"\"\"\n    spec = (spec or \"\").strip()\n    if not spec:\n        return list(range(total))\n\n    order = []\n    for part in spec.split(\",\"):\n        part = part.strip()\n        if not part:\n            continue\n        try:\n            if \"-\" in part:\n                a, _, b = part.partition(\"-\")\n                start, end = int(a), int(b)\n                step = 1 if end >= start else -1\n                chunk = list(range(start, end + step, step))\n            else:\n                chunk = [int(part)]\n        except ValueError:\n            raise ValueError(f\"'{part}' is not a page number or range.\") from None\n        for n in chunk:\n            if not 1 <= n <= total:\n                raise ValueError(f\"Page {n} does not exist in a {total}-page PDF.\")\n            order.append(n - 1)\n\n    if not order:\n        raise ValueError(\"No pages selected.\")\n    return order\n\n\ndef _place(page_rect, position, width, height, margin):\n    \"\"\"Top-left corner for a `width` x `height` box placed at `position`.\"\"\"\n    row, _, col = position.lower().partition(\" \")\n    x = {\"left\": margin,\n         \"centre\": (page_rect.width - width) / 2,\n         \"right\": page_rect.width - width - margin}[col]\n    y = {\"top\": margin,\n         \"middle\": (page_rect.height - height) / 2,\n         \"bottom\": page_rect.height - height - margin}[row]\n    return x, y\n\n\ndef render_preview(pdf_bytes, index=0, dpi=90, password=None):\n    \"\"\"One page as a JPG, for on-screen previews.\"\"\"\n    with _open(pdf_bytes, password) as doc:\n        index = max(0, min(index, doc.page_count - 1))\n        return doc[index].get_pixmap(dpi=dpi).tobytes(\"jpg\", jpg_quality=85)\n\n\ndef add_text(pdf_bytes, spec, text, position=\"Bottom centre\", size=14, color=\"#1B1F35\",\n             opacity=1.0, margin=36, password=None):\n    \"\"\"Stamp a line (or several) of text onto the selected pages.\"\"\"\n    if not text.strip():\n        raise ValueError(\"Enter the text you want to add.\")\n\n    lines = text.splitlines() or [text]\n    font = fitz.Font(\"helv\")\n    rgb = hex_to_rgb(color)\n    leading = size * 1.35\n\n    with _open(pdf_bytes, password) as doc:\n        for i in parse_pages(spec, doc.page_count):\n            page = doc[i]\n            block_w = max(font.text_length(line, size) for line in lines)\n            block_h = leading * len(lines)\n            x, y = _place(page.rect, position, block_w, block_h, margin)\n            writer = fitz.TextWriter(page.rect)\n            for row, line in enumerate(lines):\n                if line.strip():\n                    writer.append(fitz.Point(x, y + size + row * leading), line,\n                                  font=font, fontsize=size)\n            writer.write_text(page, color=rgb, opacity=opacity)\n        return doc.tobytes(garbage=4, deflate=True)\n\n\ndef add_image(pdf_bytes, spec, image_bytes, position=\"Bottom right\", width_pct=25,\n              opacity=1.0, margin=36, password=None):\n    \"\"\"Place an image (logo, signature, stamp) on the selected pages.\"\"\"\n    pix = fitz.Pixmap(image_bytes)\n    if opacity < 1:\n        if not pix.alpha:\n            pix = fitz.Pixmap(pix, 1)\n        pix.set_alpha(bytes([int(255 * opacity)]) * (pix.width * pix.height))\n    image_bytes = pix.tobytes(\"png\")\n    ratio = pix.height / pix.width\n\n    with _open(pdf_bytes, password) as doc:\n        for i in parse_pages(spec, doc.page_count):\n            page = doc[i]\n            width = page.rect.width * width_pct / 100\n            height = width * ratio\n            x, y = _place(page.rect, position, width, height, margin)\n            page.insert_image(fitz.Rect(x, y, x + width, y + height),\n                              stream=image_bytes, overlay=True)\n        return doc.tobytes(garbage=4, deflate=True)\n\n\ndef add_watermark(pdf_bytes, text, spec=\"\", size=60, color=\"#9AA0BD\", opacity=0.25,\n                  angle=45, password=None):\n    \"\"\"Diagonal watermark across the selected pages.\"\"\"\n    if not text.strip():\n        raise ValueError(\"Enter the watermark text.\")\n\n    font = fitz.Font(\"helv\")\n    rgb = hex_to_rgb(color)\n\n    with _open(pdf_bytes, password) as doc:\n        for i in parse_pages(spec, doc.page_count):\n            page = doc[i]\n            width = font.text_length(text, size)\n            centre = fitz.Point(page.rect.width / 2, page.rect.height / 2)\n            writer = fitz.TextWriter(page.rect)\n            writer.append(fitz.Point(centre.x - width / 2, centre.y + size / 3), text,\n                          font=font, fontsize=size)\n            writer.write_text(page, color=rgb, opacity=opacity,\n                              morph=(centre, fitz.Matrix(angle)))\n        return doc.tobytes(garbage=4, deflate=True)\n\n\ndef add_page_numbers(pdf_bytes, position=\"Bottom centre\", start=1, template=\"{n}\",\n                     size=10, color=\"#6B7192\", margin=28, skip_first=False, password=None):\n    \"\"\"Number the pages.\"\"\"\n    font = fitz.Font(\"helv\")\n    rgb = hex_to_rgb(color)\n\n    with _open(pdf_bytes, password) as doc:\n        total = doc.page_count\n        for i, page in enumerate(doc):\n            if skip_first and i == 0:\n                continue\n            label = template.format(n=i + start, total=total + start - 1)\n            width = font.text_length(label, size)\n            x, y = _place(page.rect, position, width, size, margin)\n            writer = fitz.TextWriter(page.rect)\n            writer.append(fitz.Point(x, y + size), label, font=font, fontsize=size)\n            writer.write_text(page, color=rgb)\n        return doc.tobytes(garbage=4, deflate=True)\n\n\ndef find_text(pdf_bytes, query, password=None):\n    \"\"\"Where a phrase appears: [(page number, hits), ...].\"\"\"\n    if not query.strip():\n        raise ValueError(\"Enter the text to search for.\")\n    with _open(pdf_bytes, password) as doc:\n        return [(i + 1, len(page.search_for(query))) for i, page in enumerate(doc)\n                if page.search_for(query)]\n\n\ndef highlight_text(pdf_bytes, query, color=\"#FFE066\", password=None):\n    \"\"\"Highlight every occurrence. Returns (pdf_bytes, hit count).\"\"\"\n    if not query.strip():\n        raise ValueError(\"Enter the text to highlight.\")\n    rgb = hex_to_rgb(color)\n\n    with _open(pdf_bytes, password) as doc:\n        hits = 0\n        for page in doc:\n            for rect in page.search_for(query):\n                annot = page.add_highlight_annot(rect)\n                annot.set_colors(stroke=rgb)\n                annot.update()\n                hits += 1\n        if not hits:\n            raise ValueError(f\"'{query}' was not found in this PDF.\")\n        return doc.tobytes(garbage=4, deflate=True), hits\n\n\ndef redact_text(pdf_bytes, query, fill=\"#000000\", password=None):\n    \"\"\"Permanently remove every occurrence. Returns (pdf_bytes, hit count).\"\"\"\n    if not query.strip():\n        raise ValueError(\"Enter the text to redact.\")\n    rgb = hex_to_rgb(fill)\n\n    with _open(pdf_bytes, password) as doc:\n        hits = 0\n        for page in doc:\n            for rect in page.search_for(query):\n                page.add_redact_annot(rect, fill=rgb)\n                hits += 1\n            if hits:\n                page.apply_redactions()\n        if not hits:\n            raise ValueError(f\"'{query}' was not found in this PDF.\")\n        return doc.tobytes(garbage=4, deflate=True), hits\n\n\ndef reorder_pages(pdf_bytes, spec, password=None):\n    \"\"\"Rebuild the document in the given page order.\"\"\"\n    with _open(pdf_bytes, password) as doc:\n        doc.select(parse_order(spec, doc.page_count))\n        return doc.tobytes(garbage=4, deflate=True)\n\n\n# --- page level editing ----------------------------------------------------\n#\n# Everything below works on a single page and takes coordinates in PDF points,\n# so the editor can translate a click on a rendered image straight into a change.\n\n\ndef page_size(pdf_bytes, index=0, password=None):\n    with _open(pdf_bytes, password) as doc:\n        rect = doc[index].rect\n        return rect.width, rect.height\n\n\ndef render_page_px(pdf_bytes, index=0, width_px=760, password=None):\n    \"\"\"Render a page to a PNG about `width_px` wide.\n\n    Returns (png_bytes, points_per_pixel) so a click on the image can be\n    converted back into PDF coordinates.\n    \"\"\"\n    with _open(pdf_bytes, password) as doc:\n        page = doc[max(0, min(index, doc.page_count - 1))]\n        zoom = width_px / page.rect.width\n        pix = page.get_pixmap(matrix=fitz.Matrix(zoom, zoom))\n        return pix.tobytes(\"png\"), 1 / zoom\n\n\ndef _int_to_rgb(value):\n    return ((value >> 16) & 255) / 255, ((value >> 8) & 255) / 255, (value & 255) / 255\n\n\ndef page_spans(pdf_bytes, index=0, password=None):\n    \"\"\"Every run of text on the page, with its box, size and colour.\"\"\"\n    with _open(pdf_bytes, password) as doc:\n        spans = []\n        for block in doc[index].get_text(\"dict\")[\"blocks\"]:\n            for line in block.get(\"lines\", []):\n                for span in line[\"spans\"]:\n                    if span[\"text\"].strip():\n                        spans.append({\n                            \"text\": span[\"text\"],\n                            \"bbox\": tuple(span[\"bbox\"]),\n                            \"size\": span[\"size\"],\n                            \"font\": span[\"font\"],\n                            \"color\": _int_to_rgb(span[\"color\"]),\n                            \"origin\": tuple(span[\"origin\"]),\n                        })\n        return spans\n\n\ndef span_at(pdf_bytes, index, point, password=None):\n    \"\"\"The text run under a point, if any. Picks the smallest box that contains it.\"\"\"\n    x, y = point\n    hits = [s for s in page_spans(pdf_bytes, index, password)\n            if s[\"bbox\"][0] <= x <= s[\"bbox\"][2] and s[\"bbox\"][1] <= y <= s[\"bbox\"][3]]\n    if not hits:\n        return None\n    return min(hits, key=lambda s: (s[\"bbox\"][2] - s[\"bbox\"][0]) * (s[\"bbox\"][3] - s[\"bbox\"][1]))\n\n\ndef replace_span(pdf_bytes, index, bbox, new_text, size=None, color=None, password=None):\n    \"\"\"Replace one run of text: remove the old glyphs, write the new ones in place.\n\n    The original font is not always embeddable, so the replacement is set in\n    Helvetica at the same size and colour.\n    \"\"\"\n    with _open(pdf_bytes, password) as doc:\n        page = doc[index]\n        rect = fitz.Rect(bbox)\n        page.add_redact_annot(rect)\n        try:\n            page.apply_redactions(images=0, graphics=0)\n        except TypeError:  # older PyMuPDF\n            page.apply_redactions()\n\n        if new_text.strip():\n            font = fitz.Font(\"helv\")\n            size = size or max(6, rect.height * 0.82)\n            # shrink to fit if the new text is longer than the space it replaces\n            while size > 4 and font.text_length(new_text, size) > rect.width * 1.6:\n                size -= 0.5\n            writer = fitz.TextWriter(page.rect)\n            writer.append(fitz.Point(rect.x0, rect.y1 - rect.height * 0.18), new_text,\n                          font=font, fontsize=size)\n            writer.write_text(page, color=color or (0, 0, 0))\n        return doc.tobytes(garbage=4, deflate=True)\n\n\ndef add_text_at(pdf_bytes, index, point, text, size=14, color=\"#1B1F35\",\n                opacity=1.0, password=None):\n    \"\"\"Write text with its top-left corner at `point`.\"\"\"\n    if not text.strip():\n        raise ValueError(\"Enter some text first.\")\n    font = fitz.Font(\"helv\")\n    with _open(pdf_bytes, password) as doc:\n        page = doc[index]\n        writer = fitz.TextWriter(page.rect)\n        for row, line in enumerate(text.splitlines() or [text]):\n            if line.strip():\n                writer.append(fitz.Point(point[0], point[1] + size * (row + 1)), line,\n                              font=font, fontsize=size)\n        writer.write_text(page, color=hex_to_rgb(color), opacity=opacity)\n        return doc.tobytes(garbage=4, deflate=True)\n",
    "ui.py": "\"\"\"Presentation helpers: theme, icons, page chrome.\"\"\"\n\nfrom pathlib import Path\n\nimport streamlit as st\n\n# Tool -> (Material icon, one-line description)\nTOOLS = {\n    \"PDF to JPG\": (\"image\", \"Render every page as a high quality JPG image.\"),\n    \"Images to PDF\": (\"picture_as_pdf\", \"Combine images into a single PDF, one per page.\"),\n    \"Extract text\": (\"notes\", \"Pull the text out of a PDF and save it as a file.\"),\n    \"Edit PDF\": (\"edit_document\",\n                 \"Work page by page: rewrite the text that is already there, or click \"\n                 \"to add new text. Keep or discard each page as you go.\"),\n    \"Apply to all pages\": (\"layers\",\n                           \"Watermarks, page numbers, stamps and find-and-redact across \"\n                           \"the whole document at once.\"),\n    \"Merge PDFs\": (\"merge\", \"Join several PDFs into one, in the order you choose.\"),\n    \"Split PDF\": (\"content_cut\", \"Break a PDF into one separate file per page.\"),\n    \"Extract pages\": (\"file_copy\", \"Keep only the pages you select.\"),\n    \"Delete pages\": (\"delete\", \"Remove the pages you no longer need.\"),\n    \"Rotate pages\": (\"rotate_right\", \"Turn pages 90, 180 or 270 degrees.\"),\n    \"Compress PDF\": (\"compress\", \"Shrink the file size of a PDF.\"),\n    \"Protect / Unlock\": (\"lock\", \"Add a password, or remove one you know.\"),\n    \"PDF info\": (\"info\", \"Inspect a document without changing it.\"),\n}\n\n# Sidebar grouping\nGROUPS = {\n    \"Convert\": [\"PDF to JPG\", \"Images to PDF\", \"Extract text\"],\n    \"Edit\": [\"Edit PDF\", \"Apply to all pages\"],\n    \"Organise\": [\"Merge PDFs\", \"Split PDF\", \"Extract pages\", \"Delete pages\", \"Rotate pages\"],\n    \"Optimise\": [\"Compress PDF\"],\n    \"Secure\": [\"Protect / Unlock\"],\n    \"Inspect\": [\"PDF info\"],\n}\n\n_LOGO = \"\"\"<svg width=\"21\" height=\"21\" viewBox=\"0 0 24 24\" fill=\"none\"\n stroke=\"white\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"/>\n<polyline points=\"14 2 14 8 20 8\"/><line x1=\"9\" y1=\"15\" x2=\"15\" y2=\"15\"/>\n</svg>\"\"\"\n\n\ndef setup():\n    \"\"\"Page config and stylesheet. Call once, first thing.\"\"\"\n    st.set_page_config(\n        page_title=\"PDF Toolkit\",\n        page_icon=\"\ud83d\udcc4\",\n        layout=\"wide\",\n        initial_sidebar_state=\"expanded\",\n    )\n    css = Path(__file__).with_name(\"styles.css\").read_text()\n    st.markdown(f\"<style>{css}</style>\", unsafe_allow_html=True)\n\n\ndef sidebar_nav(current):\n    \"\"\"Brand block plus grouped nav. Returns the selected tool.\"\"\"\n    with st.sidebar:\n        st.markdown(\n            f\"\"\"<div class=\"brand\">\n                <div class=\"brand-badge\">{_LOGO}</div>\n                <div><div class=\"brand-name\">PDF Toolkit</div>\n                <div class=\"brand-tag\">Eleven tools, one place</div></div>\n            </div>\"\"\",\n            unsafe_allow_html=True,\n        )\n\n        for group, tools in GROUPS.items():\n            st.markdown(f'<div class=\"nav-group\">{group}</div>', unsafe_allow_html=True)\n            for tool in tools:\n                icon, _ = TOOLS[tool]\n                if st.button(\n                    tool,\n                    icon=f\":material/{icon}:\",\n                    key=f\"nav_{tool}\",\n                    type=\"primary\" if tool == current else \"tertiary\",\n                    width=\"stretch\",\n                ):\n                    st.session_state.tool = tool\n                    st.rerun()\n\n        st.markdown(\n            '<div class=\"side-note\">\ud83d\udd12 Everything runs on this computer. '\n            'Your files are never uploaded to a server.</div>',\n            unsafe_allow_html=True,\n        )\n    return st.session_state.get(\"tool\", current)\n\n\ndef page_head(tool):\n    icon, description = TOOLS[tool]\n    st.markdown(\n        f\"\"\"<div class=\"page-head\">\n            <div class=\"page-icon\">\n              <span class=\"msr\">{icon}</span>\n            </div>\n            <div class=\"page-title\">{tool}</div>\n        </div>\n        <p class=\"page-sub\">{description}</p>\"\"\",\n        unsafe_allow_html=True,\n    )\n\n\ndef step(number, text):\n    \"\"\"A small numbered step label inside a card.\"\"\"\n    st.markdown(\n        f'<div style=\"font-weight:640;font-size:.9rem;color:#3A4062;margin:.1rem 0 .5rem;\">'\n        f'<span class=\"chip-num\">{number}</span>{text}</div>',\n        unsafe_allow_html=True,\n    )\n\n\ndef chips(items):\n    st.markdown(\n        '<div class=\"chip-row\">' + \"\".join(f'<span class=\"chip\">{i}</span>' for i in items) + \"</div>\",\n        unsafe_allow_html=True,\n    )\n\n\ndef info_rows(pairs):\n    rows = \"\".join(\n        f'<div class=\"info-row\"><span class=\"info-key\">{k}</span>'\n        f'<span class=\"info-val\">{v}</span></div>'\n        for k, v in pairs\n    )\n    st.markdown(rows, unsafe_allow_html=True)\n",
    "editor.py": "\"\"\"Full screen page editor: click a line of text to rewrite it.\"\"\"\n\nimport io\n\nimport streamlit as st\nfrom PIL import Image\nfrom streamlit_image_coordinates import streamlit_image_coordinates as image_click\n\nimport ops\nimport ui\n\nCANVAS_WIDTH = 1000  # rendered size; the component scales it to fit the column\nTOOLS = [\"Edit text\", \"Add text\"]\nHINTS = {\n    \"Edit text\": \"Click a line of text on the page to rewrite it.\",\n    \"Add text\": \"Click where the new text should start.\",\n}\n\n\n# --- state -----------------------------------------------------------------\n\n\ndef _start(up):\n    \"\"\"Load a file into the editor, unlocking it first if needed.\"\"\"\n    signature = (up.name, up.size)\n    if st.session_state.get(\"ed_sig\") == signature:\n        return True\n\n    data = up.getvalue()\n    try:\n        ops.page_count(data)\n    except ValueError:\n        st.warning(\"This PDF is password protected.\", icon=\":material/lock:\")\n        pw = st.text_input(\"Password\", type=\"password\", key=\"ed_pw\")\n        if not pw:\n            return False\n        try:\n            data = ops.remove_password(data, pw)\n        except ValueError as exc:\n            st.error(str(exc), icon=\":material/lock:\")\n            return False\n\n    st.session_state.update(\n        ed_sig=signature, ed_name=up.name, ed_doc=data, ed_draft=data,\n        ed_page=0, ed_dirty=False, ed_undo=[], ed_click=None, ed_target=None,\n        ed_span=None, ed_rev=0,\n    )\n    return True\n\n\ndef _bump():\n    \"\"\"Widgets keyed on this reset when the page content changes underneath them.\"\"\"\n    st.session_state.ed_rev = st.session_state.get(\"ed_rev\", 0) + 1\n\n\ndef _commit():\n    st.session_state.ed_doc = st.session_state.ed_draft\n    st.session_state.ed_dirty = False\n    st.session_state.ed_undo = []\n    st.session_state.ed_span = None\n    _bump()\n\n\ndef _revert():\n    st.session_state.ed_draft = st.session_state.ed_doc\n    st.session_state.ed_dirty = False\n    st.session_state.ed_undo = []\n    st.session_state.ed_span = None\n    _bump()\n\n\ndef _edit(new_bytes):\n    st.session_state.ed_undo.append(st.session_state.ed_draft)\n    st.session_state.ed_draft = new_bytes\n    st.session_state.ed_dirty = True\n    st.session_state.ed_span = None\n    _bump()\n\n\ndef _goto(index):\n    st.session_state.ed_page = index\n    st.session_state.ed_target = None\n    st.session_state.ed_span = None\n\n\n@st.dialog(\"Keep your changes?\")\ndef _keep_dialog():\n    page = st.session_state.ed_page + 1\n    target = st.session_state.ed_target\n    st.write(f\"Page {page} has changes you have not saved yet.\")\n    if st.button(\"Keep them and continue\", type=\"primary\", width=\"stretch\",\n                 icon=\":material/check:\"):\n        _commit()\n        _goto(target)\n        st.rerun()\n    if st.button(\"Discard them and continue\", width=\"stretch\", icon=\":material/undo:\"):\n        _revert()\n        _goto(target)\n        st.rerun()\n    if st.button(\"Stay on this page\", width=\"stretch\"):\n        st.session_state.ed_target = None\n        st.rerun()\n\n\ndef _leave(target):\n    \"\"\"Move to another page, asking about unsaved work first.\"\"\"\n    if st.session_state.ed_dirty:\n        st.session_state.ed_target = target\n    else:\n        _goto(target)\n    st.rerun()\n\n\n# --- panels ----------------------------------------------------------------\n\n\n@st.cache_data(show_spinner=False, max_entries=30)\ndef _render(data, index, width):\n    return ops.render_page_px(data, index, width_px=width)\n\n\ndef _edit_text_panel(page):\n    \"\"\"Rewrite one run of text, picked on the page or from the list.\"\"\"\n    data = st.session_state.ed_draft\n    spans = ops.page_spans(data, page)\n    if not spans:\n        st.info(\"No editable text on this page. Scanned pages hold images, not text.\",\n                icon=\":material/scanner:\")\n        return\n\n    labels = [s[\"text\"].strip()[:60] for s in spans]\n    picked = st.session_state.ed_span\n    default = picked if isinstance(picked, int) and picked < len(spans) else 0\n    rev = st.session_state.get(\"ed_rev\", 0)\n    index = st.selectbox(\"Text on this page\", range(len(spans)), index=default,\n                         format_func=lambda i: labels[i], key=f\"ed_pick_{page}_{rev}\")\n    span = spans[index]\n\n    new_text = st.text_input(\"Replace with\", value=span[\"text\"],\n                             key=f\"ed_val_{page}_{index}_{rev}\")\n    if st.button(\"Replace text\", type=\"primary\", width=\"stretch\", icon=\":material/check:\"):\n        try:\n            _edit(ops.replace_span(data, page, span[\"bbox\"], new_text,\n                                   span[\"size\"], span[\"color\"]))\n            st.rerun()\n        except Exception as exc:\n            st.error(str(exc), icon=\":material/error:\")\n    st.caption(\"The replacement is set in Helvetica at the original size: a PDF's \"\n               \"embedded fonts usually cannot be reused for new text.\")\n\n\ndef _add_text_panel():\n    return {\n        \"text\": st.text_area(\"Text\", key=\"ed_t_text\", height=90,\n                             placeholder=\"Type what you want to add, then click the page\"),\n        \"size\": st.slider(\"Size\", 6, 60, 14, key=\"ed_t_size\"),\n        \"color\": st.color_picker(\"Colour\", \"#1B1F35\", key=\"ed_t_col\"),\n        \"opacity\": st.slider(\"Opacity\", 0.1, 1.0, 1.0, 0.05, key=\"ed_t_op\"),\n    }\n\n\n# --- the page --------------------------------------------------------------\n\n\ndef _canvas(page, tool, settings):\n    \"\"\"The page image. Returns True when something changed.\"\"\"\n    data = st.session_state.ed_draft\n    png, _ = _render(data, page, CANVAS_WIDTH)\n    # \"stretch\" makes the page fit the column, which is what keeps it usable on a\n    # phone. The component reports the width it actually rendered at, so the click\n    # maths below stays correct at any size.\n    value = image_click(Image.open(io.BytesIO(png)), key=f\"ed_canvas_{page}\",\n                        cursor=\"crosshair\", width=\"stretch\")\n    if not value:\n        return False\n\n    stamp = value.get(\"unix_time\")\n    if stamp == st.session_state.get(\"ed_click\"):\n        return False\n    st.session_state.ed_click = stamp\n\n    shown = value.get(\"width\") or CANVAS_WIDTH\n    page_w, _ = ops.page_size(data, page)\n    scale = page_w / shown\n    point = (value[\"x\"] * scale, value[\"y\"] * scale)\n\n    if tool == \"Edit text\":\n        span = ops.span_at(data, page, point)\n        if span is None:\n            st.toast(\"No text there. Click directly on a line of text.\",\n                     icon=\":material/info:\")\n            return False\n        spans = ops.page_spans(data, page)\n        st.session_state.ed_span = next(\n            (i for i, s in enumerate(spans) if s[\"bbox\"] == span[\"bbox\"]), 0)\n        # Streamlit ignores a keyed widget's index once it holds a value, so the\n        # picker would keep its old selection. Changing the key re-creates it on\n        # the clicked line, and refills the text box with that line's words.\n        _bump()\n        return True\n\n    try:\n        _edit(ops.add_text_at(data, page, point, settings[\"text\"], settings[\"size\"],\n                              settings[\"color\"], settings[\"opacity\"]))\n        return True\n    except Exception as exc:\n        st.error(str(exc), icon=\":material/error:\")\n        return False\n\n\n# --- main ------------------------------------------------------------------\n\n\ndef render():\n    st.markdown(\"<style>.stMainBlockContainer{max-width:1500px;}</style>\",\n                unsafe_allow_html=True)\n\n    with st.container(border=True):\n        up = st.file_uploader(\"Choose the PDF you want to edit\", type=\"pdf\", key=\"ed_file\")\n        if not up:\n            st.session_state.pop(\"ed_sig\", None)\n            st.caption(\"Tip: collapse the sidebar with \u00ab for more room.\")\n            return\n        if not _start(up):\n            return\n\n    if st.session_state.ed_target is not None:\n        _keep_dialog()\n\n    data = st.session_state.ed_draft\n    total = ops.page_count(data)\n    page = min(st.session_state.ed_page, total - 1)\n    st.session_state.ed_page = page\n\n    tools, canvas = st.columns([0.42, 1], gap=\"medium\")\n\n    with tools:\n        with st.container(border=True):\n            ui.step(1, \"Pick a tool\")\n            tool = st.pills(\"Tool\", TOOLS, default=\"Edit text\", key=\"ed_tool\",\n                            label_visibility=\"collapsed\") or \"Edit text\"\n            st.caption(HINTS[tool])\n            st.markdown(\"\")\n            settings = {}\n            if tool == \"Edit text\":\n                _edit_text_panel(page)\n            else:\n                settings = _add_text_panel()\n\n        with st.container(border=True):\n            ui.step(2, \"This page\")\n            c1, c2 = st.columns(2)\n            if c1.button(\"Undo\", icon=\":material/undo:\", width=\"stretch\",\n                         disabled=not st.session_state.ed_undo):\n                st.session_state.ed_draft = st.session_state.ed_undo.pop()\n                st.session_state.ed_dirty = bool(st.session_state.ed_undo)\n                _bump()\n                st.rerun()\n            if c2.button(\"Revert page\", icon=\":material/restart_alt:\", width=\"stretch\",\n                         disabled=not st.session_state.ed_dirty):\n                _revert()\n                st.rerun()\n            if st.button(\"Save this page\", type=\"primary\", width=\"stretch\",\n                         icon=\":material/save:\", disabled=not st.session_state.ed_dirty):\n                _commit()\n                st.toast(\"Page saved\", icon=\":material/check_circle:\")\n                st.rerun()\n            st.caption(\"Unsaved changes on this page\" if st.session_state.ed_dirty\n                       else \"No unsaved changes\")\n\n        with st.container(border=True):\n            st.download_button(\n                \"Download PDF\", data,\n                file_name=f\"{st.session_state.ed_name.rsplit('.', 1)[0]}_edited.pdf\",\n                mime=\"application/pdf\", icon=\":material/download:\",\n                type=\"primary\", width=\"stretch\")\n            st.caption(\"Includes everything you see, saved or not.\")\n\n    with canvas:\n        with st.container(border=True):\n            left, middle, right = st.columns([1, 1.4, 1])\n            if left.button(\"Previous\", icon=\":material/chevron_left:\", width=\"stretch\",\n                           disabled=page == 0):\n                _leave(page - 1)\n            middle.markdown(\n                f\"<div style='text-align:center;font-weight:640;padding-top:.45rem;'>\"\n                f\"Page {page + 1} of {total}\"\n                f\"{' \u00b7 unsaved' if st.session_state.ed_dirty else ''}</div>\",\n                unsafe_allow_html=True)\n            if right.button(\"Next\", icon=\":material/chevron_right:\", width=\"stretch\",\n                            disabled=page >= total - 1):\n                _leave(page + 1)\n\n            if _canvas(page, tool, settings):\n                st.rerun()\n",
    "styles.css": "/* PDF Toolkit -- light theme polish */\n\n:root {\n    --ink: #1B1F35;\n    --muted: #6B7192;\n    --line: #E5E7F0;\n    --primary: #4F46E5;\n    --primary-2: #7C6BF5;\n    --primary-soft: #EEF0FE;\n    --card: #FFFFFF;\n    --shadow: 0 1px 2px rgba(27, 31, 53, .04), 0 8px 24px rgba(27, 31, 53, .06);\n}\n\n/* --- shell --------------------------------------------------------------- */\n\n.stApp { background: linear-gradient(180deg, #F7F8FC 0%, #F2F3FA 100%); }\n\n[data-testid=\"stHeader\"] { background: transparent; }\n\n[data-testid=\"stToolbar\"], [data-testid=\"stDecoration\"], [data-testid=\"stStatusWidget\"] {\n    display: none !important;\n}\n\n.stMainBlockContainer {\n    padding-top: 2.4rem;\n    padding-bottom: 4rem;\n    max-width: 880px;\n}\n\n/* --- sidebar ------------------------------------------------------------- */\n\n[data-testid=\"stSidebar\"] {\n    background: var(--card);\n    border-right: 1px solid var(--line);\n}\n\n[data-testid=\"stSidebarContent\"] { padding-top: .6rem; }\n\n.brand {\n    display: flex;\n    align-items: center;\n    gap: .75rem;\n    padding: .2rem .25rem;\n    margin: 0;\n}\n\n/* spacing and the divider live on the container, so the brand box stays\n   inside the height Streamlit gives its wrapper */\n[data-testid=\"stSidebar\"] .stElementContainer:has(.brand) {\n    padding-bottom: .85rem;\n    margin-bottom: .1rem;\n    border-bottom: 1px solid var(--line);\n}\n\n.brand-badge {\n    width: 40px;\n    height: 40px;\n    flex: 0 0 40px;\n    border-radius: 12px;\n    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    box-shadow: 0 6px 16px rgba(79, 70, 229, .35);\n}\n\n.brand-name {\n    font-size: 1.05rem;\n    font-weight: 700;\n    color: var(--ink);\n    line-height: 1.15;\n    letter-spacing: -.01em;\n}\n\n.brand-tag {\n    font-size: .74rem;\n    color: var(--muted);\n    line-height: 1.2;\n    margin-top: 2px;\n}\n\n.nav-group {\n    font-size: .68rem;\n    font-weight: 700;\n    letter-spacing: .09em;\n    text-transform: uppercase;\n    color: #9AA0BD;\n    /* No padding or margin here. Streamlit sizes the markdown wrapper from the\n       bare text, so anything that makes this box taller overflows the wrapper\n       and the next nav button draws on top of it. Space the group from the\n       outside instead, on the element container. */\n    padding: 0;\n    margin: 0;\n    line-height: 1.3;\n}\n\n[data-testid=\"stSidebar\"] .stElementContainer:has(.nav-group) {\n    margin-top: 1.15rem;\n    margin-bottom: .3rem;\n}\n\n/* Streamlit collapses the wrapper around custom markup to zero height, so the\n   label takes no space and the next nav button draws over it -- visible only\n   where that button has a background, i.e. the active one. Give the wrappers\n   real height. */\n[data-testid=\"stSidebar\"] .stElementContainer:has(.nav-group),\n[data-testid=\"stSidebar\"] .stElementContainer:has(.nav-group) [data-testid=\"stMarkdown\"],\n[data-testid=\"stSidebar\"] .stElementContainer:has(.nav-group) [data-testid=\"stMarkdown\"] > div {\n    height: auto !important;\n    min-height: 1.15rem !important;\n}\n\n[data-testid=\"stSidebar\"] .stElementContainer:has(.brand),\n[data-testid=\"stSidebar\"] .stElementContainer:has(.brand) [data-testid=\"stMarkdown\"],\n[data-testid=\"stSidebar\"] .stElementContainer:has(.brand) [data-testid=\"stMarkdown\"] > div {\n    height: auto !important;\n    min-height: 2.6rem !important;\n}\n\n\n\n/* nav items: flat tertiary buttons, indigo pill when active */\n\n[data-testid=\"stSidebarUserContent\"] [data-testid=\"stVerticalBlock\"] {\n    gap: .1rem;\n}\n\n[data-testid=\"stSidebar\"] .stButton > button {\n    justify-content: flex-start !important;\n    text-align: left !important;\n    font-weight: 500;\n    font-size: .89rem;\n    padding: .48rem .7rem;\n    min-height: 0;\n    border: none;\n    border-radius: 10px;\n    box-shadow: none;\n    color: #454B6B;\n    background: transparent;\n    transition: background .15s ease, color .15s ease;\n}\n\n[data-testid=\"stSidebar\"] .stButton > button > div,\n[data-testid=\"stSidebar\"] .stButton > button p {\n    text-align: left !important;\n    width: 100%;\n    justify-content: flex-start !important;\n}\n\n[data-testid=\"stSidebar\"] .stButton > button:hover {\n    background: #F2F3FA;\n    color: var(--ink);\n}\n\n[data-testid=\"stSidebar\"] [data-testid=\"stBaseButton-primary\"] {\n    background: var(--primary-soft) !important;\n    color: var(--primary) !important;\n    font-weight: 640 !important;\n    position: relative;\n    box-shadow: none !important;\n}\n\n[data-testid=\"stSidebar\"] [data-testid=\"stBaseButton-primary\"]::before {\n    content: \"\";\n    position: absolute;\n    left: 0;\n    top: 18%;\n    bottom: 18%;\n    width: 3px;\n    border-radius: 0 3px 3px 0;\n    background: var(--primary);\n}\n\n[data-testid=\"stSidebar\"] [data-testid=\"stBaseButton-primary\"]:hover {\n    background: #E6E9FE !important;\n}\n\n.side-note {\n    margin-top: 1.6rem;\n    padding: .7rem .8rem;\n    border-radius: 10px;\n    background: #F5F9F6;\n    border: 1px solid #DDEEE2;\n    color: #3D6B4E;\n    font-size: .74rem;\n    line-height: 1.45;\n}\n\n/* --- page head ----------------------------------------------------------- */\n\n.page-head {\n    display: flex;\n    align-items: center;\n    gap: .9rem;\n    margin-bottom: .35rem;\n}\n\n.page-icon {\n    width: 46px;\n    height: 46px;\n    flex: 0 0 46px;\n    border-radius: 13px;\n    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    box-shadow: 0 6px 18px rgba(79, 70, 229, .3);\n}\n\n.page-title {\n    font-size: 1.7rem;\n    font-weight: 750;\n    color: var(--ink);\n    letter-spacing: -.025em;\n    line-height: 1.1;\n}\n\n.page-sub {\n    color: var(--muted);\n    font-size: .92rem;\n    margin: 0 0 1.4rem 0;\n}\n\n.msr {\n    font-family: 'Material Symbols Rounded', 'Material Symbols Outlined', sans-serif;\n    font-weight: 400;\n    font-style: normal;\n    font-size: 24px;\n    line-height: 1;\n    color: #fff;\n    letter-spacing: normal;\n    text-transform: none;\n    white-space: nowrap;\n    -webkit-font-feature-settings: 'liga';\n    -webkit-font-smoothing: antialiased;\n    font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;\n}\n\n/* --- cards --------------------------------------------------------------- */\n\n[data-testid=\"stVerticalBlockBorderWrapper\"]:has(> div > [data-testid=\"stVerticalBlock\"]) {\n    border-radius: 16px;\n}\n\n.stMain [data-testid=\"stVerticalBlockBorderWrapper\"][style*=\"border\"] {\n    background: var(--card);\n    border: 1px solid #E2E4F0 !important;\n    border-radius: 16px !important;\n    padding: 1.4rem 1.5rem !important;\n    box-shadow: var(--shadow);\n}\n\n/* --- uploader ------------------------------------------------------------ */\n\n[data-testid=\"stFileUploaderDropzone\"] {\n    background: #FBFBFE;\n    border: 1.5px dashed #C9CDE4;\n    border-radius: 14px;\n    padding: 1.5rem 1rem;\n    transition: border-color .15s ease, background .15s ease;\n}\n\n[data-testid=\"stFileUploaderDropzone\"]:hover {\n    border-color: var(--primary);\n    background: var(--primary-soft);\n}\n\n[data-testid=\"stFileUploaderDropzone\"] button {\n    border-radius: 9px;\n    font-weight: 600;\n}\n\n/* --- buttons ------------------------------------------------------------- */\n\n.stMain [data-testid=\"stBaseButton-primary\"] {\n    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);\n    border: none;\n    font-weight: 640;\n    letter-spacing: .005em;\n    padding: .58rem 1.1rem;\n    box-shadow: 0 4px 14px rgba(79, 70, 229, .3);\n    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;\n}\n\n.stMain [data-testid=\"stBaseButton-primary\"]:hover {\n    filter: brightness(1.06);\n    transform: translateY(-1px);\n    box-shadow: 0 7px 20px rgba(79, 70, 229, .38);\n}\n\n.stMain [data-testid=\"stBaseButton-primary\"]:active { transform: translateY(0); }\n\n/* secondary downloads are outlined; primary ones keep the gradient */\n.stMain .stDownloadButton [data-testid=\"stBaseButton-secondary\"] {\n    background: var(--card);\n    color: var(--primary);\n    border: 1.4px solid #CFD2F2;\n    font-weight: 620;\n    transition: background .15s ease, border-color .15s ease;\n}\n\n.stMain .stDownloadButton [data-testid=\"stBaseButton-secondary\"]:hover {\n    background: var(--primary-soft);\n    border-color: var(--primary);\n    color: var(--primary);\n}\n\n.stMain .stDownloadButton [data-testid=\"stBaseButton-primary\"] {\n    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);\n    color: #fff;\n    border: none;\n    font-weight: 640;\n    box-shadow: 0 4px 14px rgba(79, 70, 229, .3);\n}\n\n.stMain .stDownloadButton [data-testid=\"stBaseButton-primary\"]:hover {\n    filter: brightness(1.06);\n    transform: translateY(-1px);\n}\n\n/* --- inputs -------------------------------------------------------------- */\n\n.stTextInput input, .stTextArea textarea, .stNumberInput input {\n    border-radius: 10px;\n}\n\n.stTextInput input:focus, .stTextArea textarea:focus {\n    border-color: var(--primary);\n    box-shadow: 0 0 0 3px rgba(79, 70, 229, .13);\n}\n\n[data-testid=\"stWidgetLabel\"] p {\n    font-weight: 600;\n    font-size: .84rem;\n    color: #3A4062;\n}\n\n/* --- feedback ------------------------------------------------------------ */\n\n[data-testid=\"stAlert\"] {\n    border-radius: 12px;\n    border: 1px solid transparent;\n}\n\n[data-testid=\"stMetric\"] {\n    background: linear-gradient(135deg, #FAFAFE 0%, #F4F5FD 100%);\n    border: 1px solid var(--line);\n    border-radius: 14px;\n    padding: 1rem 1.15rem;\n}\n\n.stImage img {\n    border-radius: 12px;\n    border: 1px solid var(--line);\n    box-shadow: var(--shadow);\n}\n\n.stImage [data-testid=\"stImageCaption\"] {\n    color: var(--muted);\n    font-size: .78rem;\n    font-weight: 500;\n}\n\n/* --- info rows (PDF info tool) ------------------------------------------- */\n\n.info-row {\n    display: flex;\n    justify-content: space-between;\n    gap: 1rem;\n    padding: .62rem .1rem;\n    border-bottom: 1px solid #F0F1F7;\n    font-size: .9rem;\n}\n\n.info-row:last-child { border-bottom: none; }\n.info-key { color: var(--muted); font-weight: 500; }\n.info-val { color: var(--ink); font-weight: 620; text-align: right; word-break: break-word; }\n\n/* --- misc ---------------------------------------------------------------- */\n\n.chip-row { display: flex; flex-wrap: wrap; gap: .4rem; margin: .1rem 0 .2rem; }\n\n.chip {\n    background: var(--primary-soft);\n    color: var(--primary);\n    border: 1px solid #DDE0FB;\n    border-radius: 999px;\n    padding: .22rem .7rem;\n    font-size: .78rem;\n    font-weight: 600;\n}\n\n.chip-num {\n    background: var(--primary);\n    color: #fff;\n    border-radius: 999px;\n    width: 17px;\n    height: 17px;\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    font-size: .66rem;\n    margin-right: .4rem;\n}\n\nhr { border-color: var(--line); }\n\nfooter, #MainMenu { visibility: hidden; }\n\n\n/* --- phones and small tablets -------------------------------------------- */\n\n@media (max-width: 640px) {\n    .stMainBlockContainer {\n        padding-top: 1.1rem;\n        padding-bottom: 2.5rem;\n        padding-left: .85rem;\n        padding-right: .85rem;\n    }\n\n    .page-head { gap: .65rem; }\n\n    .page-icon {\n        width: 38px;\n        height: 38px;\n        flex: 0 0 38px;\n        border-radius: 11px;\n    }\n\n    .page-icon .msr { font-size: 20px; }\n    .page-title { font-size: 1.25rem; }\n\n    .page-sub {\n        font-size: .86rem;\n        margin-bottom: 1rem;\n    }\n\n    .stMain [data-testid=\"stVerticalBlockBorderWrapper\"][style*=\"border\"] {\n        padding: 1rem .9rem !important;\n        border-radius: 14px !important;\n    }\n\n    /* the sidebar is an overlay on mobile: leave a strip of the page visible */\n    [data-testid=\"stSidebar\"] {\n        width: 84vw !important;\n        min-width: 0 !important;\n    }\n\n    /* comfortable tap targets */\n    .stMain .stButton button,\n    .stMain .stDownloadButton button {\n        min-height: 44px;\n    }\n\n}\n\n/* --- the editor needs a wide page, so it stacks earlier than everything else -- */\n\n@media (max-width: 1000px) {\n    /* show the page above the tools, at the full width of the screen */\n    .stMain [data-testid=\"stHorizontalBlock\"]:has(iframe) {\n        flex-direction: column;\n    }\n\n    /* Streamlit sizes columns with an inline width, so stacking alone leaves them\n       narrow: make both full width as well. */\n    .stMain [data-testid=\"stHorizontalBlock\"]:has(iframe) > [data-testid=\"stColumn\"] {\n        width: 100% !important;\n        min-width: 100% !important;\n        flex: 1 1 100% !important;\n    }\n\n    .stMain [data-testid=\"stHorizontalBlock\"]:has(iframe) > [data-testid=\"stColumn\"]:last-child {\n        order: -1;\n        margin-bottom: .9rem;\n    }\n}\n"
  },

// hide the splash once Streamlit has painted
const boot = document.getElementById("boot");
const watcher = new MutationObserver(() => {
  if (document.querySelector('[data-testid="stAppViewContainer"]')) {
    boot.classList.add("done");
    setTimeout(() => boot.remove(), 500);
    watcher.disconnect();
  }
});
watcher.observe(document.body, { childList: true, subtree: true });
